B+=cap("Exportar");
B+=sub("Memoria de cálculo en Excel");
B+=`<p>El libro tiene ocho hojas (diez en edificios, con <b>TG</b> y <b>Medidores</b>): <b>Memoria</b> (parámetros, máxima demanda, resumen, puesta a tierra, verificaciones y firmas), <b>Cálculos</b> (alimentadores, cuadro de cargas, balance y cortocircuito), <b>Unifilar</b> (cada lámina en su página), <b>Alturas</b> (diagrama de alturas de montaje), <b>Detalles</b> (leyenda y pozo de tierra), <b>Tableros</b>, <b>Metrado</b> y <b>Anexos</b> (tablas del CNE-U y normas); con precios en el presupuesto, también la hoja <b>Presupuesto</b>. Las celdas en azul son datos de entrada: al modificarlas, el libro recalcula con fórmulas vinculadas.</p>`;
B+=sub("Expediente técnico en PDF");
B+=`<p>El botón <b>Expediente PDF</b> genera el expediente completo según la EM.010, Art. 8:</p>
<ul><li><b>Portada</b> con los datos del proyecto, el espacio para la firma y el sello del proyectista y el número de revisión; <b>control del documento</b> con la tabla de revisiones.</li>
<li><b>Índice general</b>, <b>índice de tablas</b> y <b>lista de láminas</b>, cada uno en su página, con enlaces a cada sección dentro del PDF (el navegador no permite imprimir el número de página de cada entrada).</li>
<li>Memoria descriptiva; memoria de cálculo con las fórmulas y el desarrollo paso a paso de cada alimentador y del circuito más desfavorable; especificaciones técnicas; pruebas y firmas.</li>
<li><b>Metrado y presupuesto</b>: el metrado de materiales y el presupuesto referencial con los precios unitarios del proyectista (costo directo, gastos generales, utilidad, IGV, total y el monto en letras). Sin precios, una nota explica cómo completarlo.</li>
<li><b>Planos</b>: primero las <b>láminas de planta</b> del diseño (IE-01, IE-02…), con su escala y su papel; si una planta con diseño no tiene lámina, se agrega una con papel y escala automáticos, de modo que van todas las plantas. Después, las láminas que genera la plataforma (unifilar, alturas, leyenda y detalles, tableros y, en edificios, tablero general y banco de medidores), numeradas a continuación de las de planta, con sus referencias entre láminas al día. Cada lámina va reducida a una página A4, centrada y del mayor tamaño posible.</li>
<li><b>Anexos</b>: <b>A</b>, el desarrollo del cálculo de <b>cada circuito derivado</b>, por tablero, con los factores de corrección por separado (temperatura, Tabla 5A; agrupamiento, Tabla 5C); <b>B</b>, los niveles de iluminación de los ambientes marcados en el diseño (EM.010, Anexo); <b>C</b>, el protocolo de pruebas para llenar en obra (cada circuito, la puesta a tierra, las tensiones y las firmas); <b>D</b>, la lista de documentos que adjunta el proyectista (factibilidad y punto de diseño de la concesionaria, certificado de habilidad, planos de ubicación y de arquitectura, fichas técnicas y archivos DXF).</li></ul>
<p>Desde el editor de diseño, <b>Láminas › Expediente técnico</b> lo genera con el diseño tal como está.</p>
<p>Las tablas llevan solo líneas horizontales finas y el encabezado en gris suave, con los números alineados a la derecha; van numeradas por capítulo («Tabla 2.4») con su fuente o referencia normativa debajo, y las ecuaciones numeradas a la derecha. Las tablas anchas (alimentadores y cuadro de cargas) van en página horizontal. El margen izquierdo es de 22 mm para encuadernar. Se elige entre dos estilos:</p>
<ul><li><b>Formal</b>: blanco y negro, letra Arial; para presentar a la municipalidad o a la concesionaria.</li><li><b>JMG a color</b>: con los colores de la plataforma; para revisión interna o el cliente.</li></ul>
<p>En la ventana de impresión se elige <b>Guardar como PDF</b>. Si aparecen encabezados duplicados, se desmarca «Encabezados y pies de página» en Más opciones.</p>`+fig("pdf","Figura 9. Elección del estilo del expediente.");
B+=sub("Planos: SVG, PNG y DXF");
B+=`<p>Los planos —diagrama unifilar (IE-01), diagrama de alturas (IE-02), leyenda y detalles (IE-03) y detalle de tableros (IE-04) y, en edificios, tablero general (IE-05) y banco de medidores (IE-06)— se descargan desde la pestaña <b>Planos</b>: los botones PNG y SVG dan el plano que está a la vista, un archivo por lámina si el unifilar se divide. El botón <b>DXF AutoCAD</b> (en Planos y en Proyecto › Exportar) abre la ventana <b>Planos para AutoCAD</b>: se marcan las <b>láminas</b>: el <b>plano con el diseño eléctrico</b> (si el proyecto tiene diseño sobre el plano) y los planos de la plataforma con cuántas láminas tiene cada uno. Con el plano marcado, el archivo es <b>el DXF original del arquitecto tal cual</b> (sus capas, bloques, sombreados, cotas y las láminas que él armó) con el diseño eléctrico en sus coordenadas reales, a la escala de la primera lámina (1:50 si es automática), y los diagramas a esa misma escala, en filas a la derecha de la arquitectura, cada uno con su título; si el archivo original no se puede usar (R12 o binario), las plantas van como láminas dibujadas. Se eligen también el <b>archivo</b> —<b>un solo archivo</b> con todo ordenado (sin el plano: las láminas de izquierda a derecha, hasta cuatro por fila y cada una con su título encima, capa E-INDICE), o un archivo por lámina (el plano con el diseño en uno y cada diagrama en el suyo)—, el <b>papel de los diagramas</b> (A4 a A1, el mismo de Planos › Lámina; las láminas de planta van a su papel y escala) y los <b>colores</b>: <b>Colores claros</b> (azul, cobre, cian, verde y amarillo, con sus rellenos, para el fondo oscuro de AutoCAD), <b>Monocromático</b> (sin rellenos, para imprimir) o <b>Por capas</b> (sin rellenos, cada capa con su color). Con las láminas de planta, las de la plataforma se numeran después de ellas, como en el expediente. El archivo es un <b>DXF de AutoCAD 2013</b> en milímetros con el dibujo de la plataforma: letra <b>Arial</b> normal, negrita y cursiva con su altura y su alineación, el grosor de cada línea y sus guiones; las láminas de planta conservan las capas de la arquitectura (ARQ-…) y del diseño (E-ALUMBRADO, E-TOMACORRIENTES…) y su recorte. El logo del rótulo va dibujado con figuras, de modo que no depende de las fuentes instaladas. Cada parte va en su capa: E-ROTULO, E-LEYENDA, E-CUADROS, E-TEXTOS, E-NOTAS, E-MARCO y E-RELLENOS en todos; E-UNIFILAR, E-BARRAS, E-RESERVA, E-TIERRA y E-SIMBOLOS en el unifilar; E-ELEVACION, E-NIVELES y E-TUBERIA en el de alturas; E-DETALLE en el de detalles; E-TABLEROS y, si están peinados, E-CABLEADO en el de tableros. Para obtener DWG se abre el DXF en AutoCAD y se usa Guardar como.</p>`+fig("dxf","Figura 10. Descarga de los planos en DXF: elección del plano, la lámina y los colores.");
B+=fin;

B+=sub("Máxima demanda · edificio multifamiliar (050-202)");

B+=sub("Viviendas de varios pisos");

B+=sub("Dimensionamiento de alimentadores y circuitos");
B+=`<dl class="form"><dt>Corriente nominal</dt><dd>${mx(`${mi("I")} = ${fr(mi("P"),`${mi("k")} · ${mi("V")} · cos ${mi("φ")}`)}`)} &nbsp; ${mi("k")} = 1 monofásico, √3 trifásico</dd>
<dt>Corriente de diseño</dt><dd>${mx(`${sb("I","d")} = máx(${mi("f")} · ${mi("I")} ; ${sb("I","mín")})`)}; ${mi("f")} = 1.25 en circuitos derivados y en el alimentador de servicios generales (carga continua, Regla 050-104) y, en los alimentadores de vivienda y de departamentos, ${mi("f")} = 1.25 con la reserva del 25 % para ampliaciones (por defecto) o ${mi("f")} = 1.00 sin reserva, mínimo admitido por la norma porque su carga calculada no es continua (Reglas 050-200(3) y 050-202(2)); ${sb("I","mín")} solo en el alimentador principal de la vivienda (40 A) y en el de cada departamento (25 A).</dd>

<dt>Caída de tensión</dt><dd>${mx(`Δ${mi("V")} = ${fr(`${mi("K")} · ${mi("ρ")} · ${mi("L")} · ${mi("I")}`,mi("S"))}`)} &nbsp; ${mi("K")} = 2 monofásico, √3 trifásico; ${mi("ρ")} = resistividad del cobre a la temperatura de operación, por defecto (0.0209 Ω·mm²/m con aislamiento PVC a 70 °C; 0.0223 con XLPE a 90 °C), o 0.0175 Ω·mm²/m a 20 °C si así se elige en Parámetros; ${mi("L")} = longitud del tramo en metros; ${mi("S")} = sección en mm². ${mi("I")} es la <b>corriente nominal de la carga</b>, ${mi("I")} = ${mi("P")} / (${mi("V")} · cos φ) en monofásico y ${mi("P")} / (√3 · ${mi("V")} · cos φ) en trifásico, sin el factor 1.25, que se usa solo para elegir el interruptor y la capacidad del conductor. Es la fórmula resistiva: no incluye la reactancia ni cos φ, lo que da un valor igual o algo mayor que el real en las secciones usuales de viviendas y edificios. La sección es la menor de la serie normalizada que cumple a la vez la capacidad de la Tabla 2 corregida por las Tablas 5A y 5C (Iz · fc ≥ In del interruptor) y el límite de caída de tensión. Límites: alimentador principal 2.5 % (en edificios, el valor asignado al general); alimentadores secundarios 2.5 % menos lo consumido aguas arriba; circuito derivado mín(2.5 % ; 4 % − ΔV aguas arriba).</dd>

B+=sub("Cortocircuito");

B+=sub("Balance de fases");
B+=`<p>Las cargas trifásicas se reparten por igual. Las monofásicas (en edificios, cada departamento y los circuitos del TSG) se asignan a las fases buscando el menor valor de la fase más cargada: búsqueda exhaustiva hasta 10 cargas y, con más cargas, asignación voraz con mejora por intercambios. Desbalance = (fase más cargada − promedio) / promedio; criterio de diseño ≤ 10 %.</p><p>Con varios tableros, el balance se hace en <b>dos niveles</b>: primero cada tablero secundario (TD, TSG) reparte sus circuitos con el menor desbalance posible; luego se rota el orden R-S-T de cada uno para que el total quede parejo (los circuitos del TG y las unidades del edificio se reparten en el total), y al final se afina dentro de cada tablero sin subir su fase más cargada ni dejar una fase vacía. Las fases fijadas a mano se respetan. La vista Balance muestra el <b>balance de cada tablero</b>, su estado y qué circuito conviene dividir.</p>`;
B+=sub("Puesta a tierra");

B+=sub("Metrado referencial");
B+=`<p>Ordenado por las partidas de la Norma Técnica «Metrados para Obras de Edificación y Habilitaciones Urbanas» (R.D. N.° 073-2010-VIVIENDA/VMCS-DNC), título OE.5: conexión a la red externa (OE.5.1), salidas (OE.5.2.1), tuberías (OE.5.2.2), conductores (OE.5.2.3), tableros principales y de distribución (OE.5.2.6 y OE.5.2.7), dispositivos de maniobra y protección ordenados por número de polos (OE.5.2.8), puesta a tierra (OE.5.4) y complementos sin código en la norma. Las cantidades son <b>netas</b>: el desperdicio se informa para el análisis de precios.</p>
<ul><li>Tableros principales: el tablero general de la vivienda; en edificios, el de servicios generales y el de cada departamento (uno por suministro). Los demás son de distribución. Polos de cada tablero: los de sus interruptores, diferenciales, reservas y equipos adicionales.</li>
<li>Tubería de cada circuito: distancia a la salida más alejada más los <b>tramos verticales</b> con las alturas de montaje: del tablero (desde su borde superior, criterio conservador) al techo o al piso; por el techo (alumbrado, emergencia, aire, interfono), una bajada de techo − altura por salida, y en el alumbrado una por interruptor, porque el centro de luz está en la losa; por el piso (tomacorrientes, terma y fuerza), el tubo sube y vuelve a bajar en cada salida y solo sube en la última: (2<i>n</i> − 1) · <i>h</i>.</li>
<li>Conductores: metros de tubería por el número de conductores. Curvas: una por salida; uniones: una por tubo de 3 m; cajas de pase: una por circuito.</li>
<li>Interruptores de luz: uno por cada dos salidas de alumbrado. Conductor de puesta a tierra: 3 m por electrodo más 5 m al tablero.</li></ul>`;

 ["Metrado","Partidas de la R.D. N.° 073-2010-VIVIENDA (OE.5) con cantidades netas; longitudes con la salida más alejada más los tramos verticales según las alturas (por el piso, (2n − 1) × altura; salida del tablero desde su borde superior); curvas, uniones, cajas e interruptores con reglas simples.","¿Son razonables las reglas?"],
 ["Especificaciones técnicas y pruebas","Textos generales redactados para el expediente (PVC-SAP, cajas de fierro galvanizado, color del conductor de protección, pruebas).","Revisar redacción y requisitos."],
 ["Agrupamiento en el método C","Se aplica el ítem 1 de la Tabla 5C (agrupados en el aire, empotrados o encerrados) a todos los métodos. Para cables en una capa sobre pared (método C), la tabla da el ítem 2, con factores mayores (0,85; 0,79; 0,75…): la aplicación resulta más conservadora.","¿Debe usarse el ítem 2 de la Tabla 5C para el método C?"],
 ["Calentadores en edificios","En cada departamento (Regla 050-202) el calentador de agua se suma al 100 %, como en la Regla 050-200(1)(a)(v). La 050-202 no menciona expresamente los calentadores de agua (solo la calefacción); leído al pie de la letra, entrarían en «otras cargas» al 25 %.","¿Es correcto sumar los calentadores al 100 % en la 050-202?"],
 ["Diámetro de la varilla","La verificación de la Regla 060-702(3)(a) solo exige 13 mm (cobre); la aplicación no distingue la varilla de acero-cobre, que requiere 16 mm (5/8\").","¿Conviene pedir el material de la varilla y verificar 16 mm para acero-cobre?"],
 ["Método de instalación por defecto","Desde la v2.3 el método por defecto es B1: según la Tabla 4 del CNE-U (ítem 59), los conductores aislados en tubo empotrado en paredes de mampostería (ladrillo o concreto, resistividad térmica ≤ 2 K·m/W) se calculan con el método B1. El método A1 corresponde a tubos en paredes térmicamente aislantes y sigue disponible.","¿Conforme con B1 como método por defecto para viviendas de albañilería y concreto?"],
 ["Umbrales de las recomendaciones de diseño","Dos calibres sobre lo necesario por corriente; corriente mínima ≥ 2 veces la carga; 90 % del límite de caída de tensión o de capacidad; 180 W por tomacorriente; 30 °C (ver «Recomendaciones de diseño» en la Parte I).","¿Son adecuados los umbrales? ¿Falta o sobra alguna recomendación?"],
 ["Otros usos: criterios de cálculo","Regla 050-210 y Tabla 14 con la columna de alimentadores; área según dimensiones exteriores con el sótano al 100 %; cargas especiales al 100 % de su potencia nominal; sin corriente mínima de 40 A; alimentadores con 1.25 × I por carga continua (Regla 050-104(3)).","¿Conforme con estos criterios para oficinas y locales comerciales?"],
 ["Otros usos: 250 VA por tomacorriente","Criterio de ingeniería (no lo fija el CNE-U): margen para varios equipos por punto dúplex. Se ingresa como W y se calcula con el factor de potencia del proyecto.","¿Conforme con 250 VA como valor por defecto en oficinas y comercios?"],
 ["Escuelas, hospitales y hoteles","Reglas 050-204, 050-206 y 050-208: el factor de demanda se aplica a la carga por área más las cargas especiales (aire acondicionado y equipos incluidos); sobre 900 m², según la carga por m². El área especial (aulas o alta intensidad) se ingresa por piso. Mismos criterios de área exterior, sin mínimo de 40 A y 1.25 × I en alimentadores.","¿Conforme con incluir el aire acondicionado y los equipos en la carga afectada por el factor de demanda («carga restante»)?"],
 ["Sección elegida en el cuadro de conductores","El proyectista puede usar en cada tramo una de las tres secciones siguientes a la mínima que cumple; nunca una menor. La elección se guarda en el proyecto y vuelve a la automática si deja de ser mayor que la mínima.","¿Conforme con limitar la elección a secciones mayores que la mínima que cumple y con avisarlo como recomendación?"],
 ["Aislamiento de temperatura intermedia","Si el fabricante indica una temperatura de servicio entre 70 °C y 90 °C, se recomienda usar la columna de 70 °C de la Tabla 2 (del lado seguro).","¿Conforme con este criterio para conductores de temperatura intermedia?"],
 ["Cargas de 1 500 W o menos en departamentos","Tienen su circuito, pero no se suman en «otras cargas» de la máxima demanda (Regla 050-202(1)(a)), igual que en la vivienda: se consideran cubiertas por la carga básica. Antes de la v2.9 el total escrito en «Otras cargas > 1 500 W» se sumaba aunque fuera menor.","¿Conforme con aplicar a los departamentos el mismo criterio de la vivienda unifamiliar?"],
 ["Poder de corte mínimo","Cada tablero usa el mayor entre el poder de corte que exige su Icc y 4.5 kA, el mínimo comercial usual (IEC 60898-1). Desde la v2.9.3, los tableros con Icc baja pasan de 3 kA a 4.5 kA.","¿Conforme con 4.5 kA como mínimo por defecto?"],
 ["Tipo de interruptor diferencial","Tipo A por defecto en todos los circuitos; con la opción AC, tipo A solo donde haya cargas marcadas «con electrónica» (IEC 60364-5-53, IEC 62423).","¿Qué tipo usan en sus proyectos: A en todos, o AC con A en las cargas con electrónica?"],
 ["Arranque de motores","Arranque directo con 6 veces la corriente nominal; se verifica que la corriente de arranque no alcance el disparo magnético mínimo de la curva (D: 10 In). La caída de tensión en el arranque (≈ 6 × ΔV del circuito, sin reactancia) se informa sin límite.","¿Qué límite de caída de tensión en el arranque aplican (por ejemplo, 10 % o 15 %)?"],
 ["Tableros principales y de distribución","En el metrado son tableros principales el general de la vivienda y, en edificios, el de servicios generales y el de cada departamento (uno por suministro); los demás son de distribución.","¿Es la clasificación que corresponde a las partidas OE.5.2.6 y OE.5.2.7?"],
 ["Alturas de montaje","Por defecto: interruptor 1.20 m y tomacorrientes 0.40 m y 1.20 m (dentro de la A.120); techo 2.90, tablero 1.80, braquete 2.00, terma 1.50, medidor 1.10, fuerza 0.40 y aire 2.00 m como criterio. Todas son editables.","¿Son los valores usuales en sus proyectos y los que pide la concesionaria?"],
 ["Detalle del pozo de tierra","Medidas del hoyo y de la tapa, sal 100 kg, carbón 50 kg (solo con tratamiento), tierra negra 1.5 m³, conductor 15 m más 3 m por varilla adicional y PVC 10 m: valores de referencia editables (no los fija el CNE).","¿Son los materiales y cantidades usuales en sus proyectos?"],
 ["Colores de los conductores","En los tableros: fases R rojo, S negro y T azul (F rojo en monofásico), neutro blanco y protección verde-amarillo, según la práctica usual; el orden de las fases es criterio.","¿Qué código de colores exigen en obra?"],
 ["Medida y tipo de gabinete","Medidas de catálogo según los polos (PVC 280 × 220 y 300 × 370 mm; metálico de 250 × 300 a 600 × 1200 mm) y polos por fila según su ancho; PVC por defecto en viviendas y departamentos hasta 24 polos, metálico en el TSG y en los mayores. La puerta de PVC no lleva la señal de riesgo eléctrico.","¿Son medidas y tipos usuales en sus proyectos? ¿Exigen la señal también en los tableros de PVC?"],
 ["Tablero general del edificio","Gabinete metálico de referencia de 600 × 1000 mm, interruptor general en caja moldeada y barras N, R, S y T de las que sale la fase de cada suministro según el balance.","¿Conforme con esta disposición y con la caja moldeada para el interruptor general?"],
 ["Láminas del unifilar","El unifilar se divide en láminas IE-01, IE-01A… para que el texto más pequeño mida al menos 1.8 mm impreso (ISO 3098, adoptada como criterio).","¿Es adecuado ese mínimo para los planos que presentan?"],
 ["Longitud de los circuitos medida en el plano","Recorrido más corto por las tuberías hasta la salida más alejada, más los tramos verticales según las alturas de montaje; con la carga conectada de todo el circuito (Regla 050-102).","¿Es aceptable este criterio de medición para el expediente?"],
 ["Agrupamiento por tubería","Cada circuito del plano usa el factor de la Tabla 5C del mayor número de circuitos que van juntos en una de sus tuberías.","¿Es correcto tomar el peor tramo para todo el circuito?"],
 ["Áreas del plano","Vivienda: suma de las áreas techadas interiores de los ambientes marcados (incluidos pasillos y baños); otros usos: contorno exterior del piso.","¿Conforme con la forma de marcar las áreas?"],
 ["Retornos de los interruptores","Se escriben sin conductor de protección (unipolar 2, tres vías 3, cuatro vías 4 conductores).","¿Exigen conductor de protección hasta los interruptores?"],
 ["Locales en el edificio","Los locales de otro uso se calculan por la 050-210 y se suman al 75 % en el alimentador general (050-202(3)(d)); el proyectista puede usar el 100 %.","¿Conforme con el 75 % por defecto para los locales del edificio?"],
 ["Conductores contados por el recorrido","La fase llega a cada interruptor; cada tecla devuelve un retorno por el camino hasta sus luminarias, y el neutro y la tierra llegan a las luminarias (por ejemplo, 1F+2R+1N+T). En el metrado, los retornos cuentan como conductores activos.","¿Conforme con este conteo y con la marca «r» del retorno en los planos?"],
 ["Entrepiso de los montantes","3.10 m por piso por defecto, editable.","¿Es un valor usual en sus proyectos?"],
 ["Equipos adicionales del tablero","DPS tipo 2 (In 20 kA, Up ≤ 1.5 kV), relé de tensión, medidor y contactor con reloj se rotulan en el unifilar, el metrado y la memoria, sin cambiar el cálculo.","¿Son adecuadas estas características de referencia para los equipos?"],
 ["Banco de medidores lejos del TG","El alimentador TG → banco lleva la demanda de los departamentos (y la de los servicios si su medidor está en el banco); los departamentos y el TSG suman su caída de tensión y su cortocircuito a los de ese tramo.","¿Es correcto acumular la caída del tramo TG → banco en los alimentadores de los departamentos?"],
 ["Tuberías del TG al banco","Con el banco junto al TG, fases y neutros de cada suministro con la sección de su alimentador, sin tierra, al 40 % de ocupación y en tuberías de hasta Ø 50 mm (criterio editable).","¿Es adecuado el diámetro máximo de 50 mm por tubería?"],
 ["Balance de fases por tablero","Cada tablero secundario se balancea primero por separado y luego se ordenan sus fases para el total.","¿Conforme con priorizar el balance de cada tablero?"]];
B+=cap("Supuestos y decisiones a revisar");
B+=`<p>Esta lista reúne los criterios de la aplicación que no provienen textualmente de una regla, o que dependen de una interpretación. Para cada punto se indica qué hace la aplicación y la pregunta para el revisor. Marque Conforme u Observación y anote sus comentarios.</p>`;
B+=tbl(["N.°","Tema · qué hace la aplicación","Conforme","Observación"],REV.map(([t,d,q],i)=>[`R-${String(i+1).padStart(2,"0")}`,`<b>${t}.</b> ${d}<span class="q">${q}</span>`,"☐","☐"]),"rev");
B+=fin;

B+=cap("Casos de verificación");
B+=`<p>Resultados obtenidos con la aplicación (versión ${VERSION}). Sirven para comprobar el cálculo a mano o con otra herramienta. Los expedientes de ejemplo en PDF muestran el desarrollo paso a paso de los alimentadores.</p>`;
CASOS.forEach(c=>{ B+=`<h3>${c.id} · ${c.tit}</h3><p>${c.desc}</p>`;
  B+=kv([["Sistema",c.sis],...(Number.isFinite(c.area)?[["Área computable",`${f(c.area,1)} m²`]]:[]),["Potencia instalada · máxima demanda",`${f(c.CI/1000,2)} kW · <b>${f(c.MD/1000,2)} kW</b>`],["Potencia a contratar",`${f(c.contratada,1)} kW`],
    ["Tableros (circuitos)",c.tabs],["ΔV máxima total",`${f(c.maxDV,2)} %`],["Icc en el TG",`${f(c.icc,2)} kA`],["Puesta a tierra",`${f(c.pat,2)} Ω · ${c.nVar} varilla(s)`],...(c.desb!=null?[["Desbalance de fases",`${f(c.desb,1)} %`]]:[]),["Estado",c.ok?"Conforme":"Revisar"]]);
  B+=tbl(["Alimentador","P (W)","I (A)","Id (A)","ITM (A)","Conductor (mm²)","PE (mm²)","ΔV %","ΔV acum. %"],c.alims.map(a=>[a.d,f(a.P,0),f(a.I,2),f(a.Id,2),a.itm,a.cond,a.St,f(a.dv,2),f(a.ac,2)])); });
B+=fin;

B+=cap("Hoja de observaciones");
B+=`<p>Observaciones generales, puntos de la lista R-01 a R-${String(REV.length).padStart(2,"0")} y recomendaciones de mejora.</p>`;
B+=tbl(["N.°","Referencia","Observación o recomendación"],Array.from({length:14},(_,i)=>[i+1,"",""]),"obs-tbl");
B+=`<div class="firmas">${["Revisado por","Revisado por"].map(t=>`<div class="firma"><b>${t}</b><div class="l"></div><dl><dt>Nombre</dt><dd></dd><dt>CIP N.°</dt><dd></dd><dt>Institución</dt><dd></dd><dt>Fecha</dt><dd></dd></dl></div>`).join("")}</div>`;
B+=fin;

const portada=`<section class="portada"><div class="top"><img src="${typeof LOGO_JPG==="string"?LOGO_JPG:"../logo.png"}" alt=""><div><b>JMG Projects &amp; Energy</b><span>JMG - ELECTRIC · versión ${VERSION}</span></div></div>
<div class="mid"><p class="eye">Documentación</p><h1>Manual de usuario y referencia técnica</h1><p class="sub">Diseño y cálculo de instalaciones eléctricas interiores en viviendas, edificios multifamiliares, oficinas, comercios, escuelas, hospitales y hoteles</p></div>
<dl><dt>Aplicación</dt><dd>JMG - ELECTRIC ${VERSION} · jorgemiguelc16.github.io/jmg-electric</dd><dt>Normativa</dt><dd>CNE-Utilización · RNE EM.010 · Norma DGE</dd><dt>Autor</dt><dd>Jorge Miguel Condori Huayllani</dd><dt>Fecha</dt><dd>${fecha}</dd></dl>
<div class="foot"><span>Parte I · Manual de usuario</span><span>Parte II · Referencia técnica para revisores</span></div></section>`;

document.title="JMG-ELECTRIC - Manual de usuario y referencia técnica "+VERSION;
