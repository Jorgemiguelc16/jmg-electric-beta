<div id="doc"></div>
<script>
/* ---------- utilidades ---------- */
const f=(x,d=2)=>Number.isFinite(x)?x.toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:false}):"—";
const mi=s=>`<i>${s}</i>`, sb=(v,s)=>`<i>${v}</i><sub>${s}</sub>`, fr=(a,b)=>`<span class="mf"><span>${a}</span><span>${b}</span></span>`, sq=x=>`√<span class="ms">${x}</span>`, mx=x=>`<span class="mx">${x}</span>`;
const tbl=(head,rows,cls="")=>`<table class="${cls}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
const kv=rows=>`<table class="kv"><tbody>${rows.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</tbody></table>`;
const fig=(img,txt)=>`<figure class="fig"><img src="img/${img}.png" alt=""><figcaption>${txt}</figcaption></figure>`;
const TOC=[]; let n1=0,n2=0;
// Cada título lleva un id para que el índice enlace a él (el PDF conserva los enlaces)
const tid=n=>"m-s"+n.replace(/\./g,"-");
const parte=(rom,t,d)=>{ TOC.push(["",`Parte ${rom} · ${t}`,"p",`m-p${rom}`]); return `<section class="parte" id="m-p${rom}"><p>Parte ${rom}</p><h1>${t}</h1><div>${d}</div></section>`; };
const cap=(t,cls="cap")=>{ n1++; n2=0; TOC.push([`${n1}`,t,"l0",tid(`${n1}`)]); return `<section class="${cls}"><h1 id="${tid(`${n1}`)}"><span class="n">${n1}.</span>${t}</h1>`; };
const sub=t=>{ n2++; TOC.push([`${n1}.${n2}`,t,"l1",tid(`${n1}.${n2}`)]); return `<h2 id="${tid(`${n1}.${n2}`)}"><span class="n">${n1}.${n2}</span>${t}</h2>`; };
const fin="</section>";
const fecha=new Date().toLocaleDateString("es-PE",{day:"2-digit",month:"long",year:"numeric"});
let B="";

/* ================= PARTE I · MANUAL DE USUARIO ================= */
B+=parte("I","Manual de usuario","Cómo crear un proyecto, diseñarlo sobre el plano de arquitectura, completar los datos de la vivienda o del edificio, revisar los resultados y obtener las láminas de planta eléctrica, la memoria de cálculo en Excel, el expediente técnico en PDF y el diagrama unifilar para AutoCAD.");

B+=cap("Introducción");
B+=sub("Qué es JMG - ELECTRIC");
B+=`<p>JMG - ELECTRIC es una aplicación web para el <b>diseño y el cálculo</b> de instalaciones eléctricas interiores de <b>viviendas unifamiliares</b> (de uno o varios pisos), <b>edificios multifamiliares</b> y <b>otros usos</b>: oficinas, locales comerciales y demás actividades de la Tabla 14, escuelas, hospitales y hoteles, conforme al Código Nacional de Electricidad – Utilización (CNE-U), al Reglamento Nacional de Edificaciones, Norma EM.010, y a la Norma DGE de conexiones en baja tensión. Funciona en el navegador, sin instalación, en <b>jorgemiguelc16.github.io/jmg-electric</b>.</p>
<p>El proyecto se diseña sobre el plano de arquitectura en DXF: se colocan los tableros, las salidas con los símbolos de la Norma DGE (R.M. N.° 091-2002-EM/VME), las tuberías, los montantes y las áreas, y el cálculo toma del plano los circuitos, las longitudes reales y las áreas (capítulo 7). También puede calcularse sin plano, con los datos escritos en las ventanas.</p>
<p>A partir de los datos del proyecto calcula la máxima demanda, los alimentadores y circuitos derivados, las protecciones, la caída de tensión, el cortocircuito, el balance de fases y la puesta a tierra; dibuja el diagrama unifilar y las láminas de planta eléctrica y genera el metrado, la memoria de cálculo en Excel y el expediente técnico en PDF.</p>`;
B+=sub("Alcance del diseño y del cálculo");
B+=`<p><b>Diseño sobre el plano</b></p><ul>${ALCANCE_DIS.map(t=>`<li>${t}</li>`).join("")}</ul><p><b>Cálculo según el CNE-Utilización</b></p><ul>${ALCANCE.map(t=>`<li>${t}</li>`).join("")}</ul>`;
B+=sub("Responsabilidad");
B+=`<div class="caja"><p>Los resultados son una herramienta de apoyo al diseño. Su validación, la adecuación a las condiciones reales de obra y la firma del expediente corresponden al <b>ingeniero colegiado y habilitado</b> que lo suscribe (RNE EM.010, Art. 8). Los proyectos se guardan solo en el navegador del usuario.</p></div>`;
B+=fin;

B+=cap("Primeros pasos");
B+=sub("Acceso con cuenta");
B+=`<p>Para usar la plataforma se necesita una <b>cuenta aprobada</b>. En la pantalla de ingreso se entra con <b>«Continuar con Google»</b> o con <b>correo y contraseña</b>; el <b>ojo</b> junto a la contraseña la muestra u oculta, y «¿Olvidó su contraseña?» envía un correo para cambiarla. La sesión se recuerda hasta pulsar <b>Cerrar sesión</b> en el menú de la cuenta. Al iniciar sesión, la plataforma se abre en <b>Inicio</b> y muestra la bienvenida (no se repite al recargar la página). Si el usuario ya tiene proyectos, el botón principal de la bienvenida es <b>«Continuar»</b> con su último proyecto; si no, <b>«Ver un ejemplo»</b>. La versión y los datos de la plataforma están en <b>Acerca de</b>. El ícono de la cuenta, en la barra superior, muestra la <b>foto de la cuenta de Google</b> o, si se ingresó con correo y contraseña, la <b>inicial del nombre</b>.</p><ul><li><b>Solicitar una cuenta:</b> nombre, correo, contraseña (o Google) y para qué se usará la plataforma. La solicitud queda <b>en revisión</b>; al aprobarse, la pantalla del usuario se abre sola.</li><li><b>Cuenta creada con Google:</b> no tiene contraseña propia en la plataforma (la de Gmail no sirve aquí). Para ingresar también con el correo, en el menú de la cuenta se elige <b>Crear contraseña</b>; desde entonces el menú dice <b>Cambiar contraseña</b>. Sigue siendo la misma cuenta, con los mismos proyectos.</li><li><b>Vigencia:</b> el administrador puede dar a cada cuenta una vigencia (indefinida, 1, 3 o 6 meses o 1 año). Al vencer, la pantalla de ingreso muestra <b>«Su acceso venció»</b>; los proyectos se conservan y vuelven a estar disponibles cuando el administrador la renueva.</li><li>Las cuentas se gestionan con <b>Firebase Authentication</b> (Google): nadie, ni siquiera el administrador, puede ver las contraseñas.</li></ul>`;

B+=sub("Pantalla de inicio");
B+=`<p>La plataforma tiene una <b>barra superior</b> con el logotipo, la campana de <b>Novedades</b> y el acceso a <b>Ajustes</b>, y un <b>menú lateral</b> con las secciones: Inicio, Proyectos, Herramientas, Normas aplicadas, Guía y manual, Novedades, Soporte, Acerca de y Ajustes.</p><p>El Inicio es el <b>Centro de ingeniería</b>:</p><ul><li><b>Nuevo proyecto</b> y, si hay uno en curso, <b>Continuar</b>.</li><li><b>Contadores</b> de los proyectos guardados en este navegador: total, completos y conformes, con datos pendientes y el último editado.</li><li><b>Continuar trabajando</b>: los tres últimos proyectos, con un dibujo según su tipo, el avance (según los datos que faltan), el estado del último cálculo (conforme, revisar o datos pendientes) y la máxima demanda. El estado se actualiza cada vez que el proyecto se calcula; los proyectos guardados con versiones anteriores lo muestran al abrirlos una vez. Si no hay proyectos, se ofrecen los ejemplos.</li><li><b>Base normativa</b> y <b>Accesos rápidos</b> a las herramientas de caída de tensión, conductor, puesta a tierra y al manual.</li></ul><p>La sección <b>Acerca de</b> reúne el propósito de la plataforma, su creador, cómo funciona y su alcance.</p>`+fig("inicio","Figura 1. Pantalla de inicio.");
B+=sub("Crear un proyecto nuevo");
B+=`<p>El asistente pide el <b>tipo de edificación</b> (vivienda unifamiliar, edificio multifamiliar o comercial y otros usos, con el uso específico de la edificación), el nombre del proyecto (obligatorio), el propietario, la ubicación, el proyectista, su <b>número de CIP</b> y el sistema de suministro. Al final se elige <b>cómo trabajar</b>:</p><ul><li><b>Diseño con plano</b> (recomendado): el proyecto se calcula con lo dibujado y se abre el <b>editor de diseño</b> pidiendo el plano DXF del arquitecto. Un proyecto que se trabaja con el plano se abre después directamente en el editor.</li><li><b>Cálculo rápido</b>: los datos se escriben en las ventanas, como en las versiones anteriores; se abre el espacio de trabajo con los datos pendientes marcados en ámbar.</li></ul>`+fig("asistente","Figura 2. Asistente de nuevo proyecto.");
B+=sub("Guardar y abrir proyectos");
B+=`<ul><li>El proyecto se <b>guarda automáticamente</b> en el navegador cuando tiene nombre. Los proyectos de ejemplo no se guardan.</li>
<li><b>Proyectos en la nube:</b> con la cuenta aprobada, cada proyecto guardado se copia también a la cuenta, con su plano DXF (hasta 60 MB). Al ingresar desde otra computadora aparecen los mismos proyectos con sus planos; si un proyecto cambia en una computadora, la otra trae la versión más reciente, y un proyecto eliminado se elimina en todas. Los cambios se suben a más tardar 30 segundos después y al cerrar o cambiar de pestaña. La barra de estado indica <b>«Nube: al día»</b>, «guardando…» o «sin conexión»: sin internet se sigue trabajando en el navegador y se sube al volver la conexión. Si el mismo proyecto se edita a la vez en dos computadoras, queda la versión guardada más reciente.</li>
<li>La pestaña <b>Proyectos</b> lista los proyectos guardados con las acciones Abrir, Duplicar, Exportar y Eliminar.</li>
<li>Al abrir un proyecto guardado con una versión anterior, los datos que esa versión todavía no tenía toman su <b>valor por defecto</b> (nunca el del proyecto que estaba abierto antes).</li>
<li><b>Archivo › Guardar copia .json</b> descarga el proyecto a un archivo, con su plano DXF; <b>Archivo › Abrir .json</b> lo vuelve a cargar.</li><li><b>Respaldo</b> (pantalla de inicio, Proyectos): <b>Descargar respaldo</b> guarda <b>todos</b> los proyectos, con sus planos DXF, en un solo archivo .json; <b>Restaurar</b> los vuelve a cargar desde ese archivo sin borrar ninguno de los que ya están. Conviene descargarlo de vez en cuando y guardarlo fuera de la computadora.</li></ul>`;
B+=fin;

B+=cap("El espacio de trabajo");
B+=`<p>El espacio de trabajo reúne en una sola pantalla la cinta de opciones, el explorador del proyecto, los resultados y el panel del proyecto. Los datos se ingresan siempre en <b>ventanas</b>, que se abren desde el explorador (doble clic) o desde la cinta, como en los programas de ingeniería; el espacio de trabajo y el panel del proyecto solo muestran.</p>`+fig("resumen","Figura 3. Espacio de trabajo con el proyecto de ejemplo.");
B+=sub("Partes de la pantalla");
B+=tbl(["Zona","Uso"],[
 ["Barra de título","Nombre del proyecto y tipo de edificación. A la derecha: botones para mostrar u ocultar el explorador y el panel del proyecto, la versión, Ayuda y Salir. A la izquierda: Guardar, Deshacer, Rehacer y Exportar Excel."],
 ["Cinta de opciones","Pestañas Archivo, Proyecto, Cargas, Parámetros, Resultados, Planos, Herramientas y Ayuda, siempre visibles, con los comandos agrupados en botones grandes y columnas de botones pequeños. La pestaña Proyecto reúne los accesos más usados; Cargas, Parámetros, Resultados y Planos llevan además accesos directos a cada dato (por ejemplo, factor de potencia, método de instalación, temperatura, reserva, diferenciales o N.° CIP del rótulo); Archivo y Ayuda incluyen guardar, deshacer, ejemplos, ajustes, novedades y atajos de teclado. Cada grupo tiene un botón grande con su acción principal y, al lado, una columna de hasta tres botones pequeños. Solo llevan <b>▾</b> (menú desplegable) los botones donde elegir desde la cinta ahorra pasos: <b>Sistema eléctrico</b>, <b>Agregar carga</b>, <b>Agregar carga común</b> y <b>Salidas de otra potencia</b>; los demás llevan directo a su dato o abren su ventana. La pestaña Proyecto reúne los datos del proyecto, la edificación (pisos o departamentos, editor de cargas), el cálculo y la exportación (memoria Excel, expediente PDF y unifilar en DXF); la pestaña Parámetros, la ventana de parámetros de diseño y los datos más usados; las calculadoras rápidas están en la pestaña Herramientas. Los íconos van en azul marino con detalles en cobre (dorados en el tema oscuro), salvo Excel, PDF y AutoCAD. El botón Recomendaciones muestra el número de recomendaciones pendientes. Las vistas de resultados se eligen en <b>Resultados › Vistas</b>: el botón de la vista abierta queda marcado y un punto rojo o ámbar avisa lo que no cumple o hay por revisar. El grupo <b>Proyecto › Panel del proyecto</b> muestra u oculta cada sección del panel derecho. Si la cinta no cabe en la pantalla, la rueda del mouse sobre ella la desplaza hacia los lados."],
 ["Explorador del proyecto (izquierda)","Árbol con los datos del proyecto, los tableros y cada circuito. El punto verde indica dato completo y conforme; ámbar, dato pendiente; rojo, circuito que no cumple. Un clic elige el elemento y muestra su resumen en el panel del proyecto; con <b>doble clic</b> se abre su ventana: la ficha de un circuito o de un tablero, los datos del proyecto en la pestaña que corresponde (Proyecto, Suministro, Vivienda, Salidas o Departamentos), el editor de cargas (cargas especiales y servicios generales), los parámetros de diseño (también para la puesta a tierra) o el metrado. El número del encabezado es la cantidad de circuitos (o, en ámbar, de datos pendientes)."],
 ["Resultados (centro)","La vista elegida en Resultados › Vistas: Resumen, Máxima demanda, Alimentadores, Cuadro de cargas, Balance de fases (solo con suministro trifásico), Diagrama unifilar, Diagrama de alturas, Leyenda y detalles, Detalle de tableros, Metrado y Verificaciones. Solo muestra la vista: las descargas de los planos están en Planos › Descargar."],
 ["Panel del proyecto (derecha)","De <b>solo lectura</b>, con tres secciones que se muestran u ocultan en <b>Proyecto › Panel del proyecto</b>: <b>Resumen</b> (máxima demanda, potencia a contratar, alimentador, interruptor general, ΔV máxima, puesta a tierra y estado), <b>Elemento seleccionado</b> (el resumen del elemento elegido en el explorador, con un botón que abre su ventana) y <b>Por revisar</b> (datos que faltan, tramos que no cumplen o con poco margen y recomendaciones pendientes; un clic abre la ventana donde se corrige). Está cerrado por defecto; al activar una sección con el panel cerrado, se abre. La plataforma recuerda qué secciones se eligieron."],
 ["Barra de estado","Modo de cálculo, máxima demanda, alimentador, caída de tensión máxima y estado general (CONFORME o REVISAR)."]]);
B+=sub("Paneles laterales");
B+=`<ul><li>El ancho del explorador y del panel del proyecto se ajusta <b>arrastrando su borde</b>; doble clic en el borde restablece el ancho.</li>
<li>Cada panel se cierra con la <b>×</b> de su encabezado y se vuelve a abrir con los botones de la barra de título.</li>
<li><b>Zoom de los resultados:</b> los botones <b>−</b>, <b>100 %</b> y <b>+</b> de la esquina inferior derecha del panel central acercan o alejan solo los resultados (por ejemplo, para revisar el diagrama unifilar en detalle), de 50 % a 300 %. También se usa <b>Ctrl + rueda del mouse</b> sobre el panel. Con zoom mayor de 100 %, o sobre el diagrama unifilar, aparece una <b>mano</b>: con el clic sostenido el contenido se desplaza en cualquier dirección; el botón del porcentaje vuelve al tamaño normal.</li>
<li><b>Ayuda de cada dato y botón:</b> al detener el cursor sobre un dato, su nombre o un botón aparece su explicación en un globo pequeño y discreto (o al llegar a él con la tecla Tab). No aparece al hacer clic ni cuando solo repetiría un texto que ya se lee completo en pantalla.</li>
<li><b>Tamaño de la pantalla:</b> el espacio de trabajo se muestra por defecto al <b>80 %</b>, para ver a la vez la cinta, el árbol, los resultados y el panel del proyecto sin desplazarse. Se cambia a 90 % o 100 % en <b>Ajustes › Tamaño del espacio de trabajo</b>. Conviene dejar el zoom del navegador en 100 % (Ctrl + 0), porque los dos se multiplican. En las páginas de inicio, si el navegador se aleja, la plataforma compensa el tamaño para que el contenido no quede diminuto.</li></ul>`;
B+=sub("Ventanas de trabajo");
B+=`<p>Los datos se ingresan y los resultados se revisan en detalle en <b>ventanas de escritorio</b>, al estilo de los programas de ingeniería: <b>Datos del proyecto</b> y <b>Parámetros de diseño</b> (datos de entrada), <b>Editor de cargas</b>, <b>Ficha del circuito</b>, <b>Ficha del tablero</b>, <b>Cuadro de conductores</b>, <b>Verificar longitudes</b> y <b>Niveles de iluminación</b>. Todas comparten el mismo comportamiento:</p>
<ul><li>Se <b>mueven</b> arrastrando la barra de título y se <b>redimensionan</b> desde cualquier borde o esquina. Doble clic en la barra (o el botón □) las maximiza o restaura.</li>
<li>Recuerdan su posición y su tamaño en el navegador, y nunca salen de la pantalla.</li>
<li>Si se angostan, las tablas ocultan primero las columnas secundarias (uso de ΔV, longitud, ITM y sección mínima) en lugar de desplazarse hacia el costado.</li>
<li>Los cambios quedan <b>pendientes</b> (en celeste) hasta pulsar <b>Aplicar</b> (la ventana sigue abierta) o <b>Aceptar</b> (aplica y cierra). <b>Cancelar</b>, la <b>×</b> o <span class="k">Esc</span> cierran sin aplicar. Lo aplicado se puede deshacer con <span class="k">Ctrl</span> + <span class="k">Z</span>.</li>
<li>En las ventanas, los cuadros <b>blancos</b> se pueden editar y los <b>grises</b> son resultados de solo lectura.</li>
<li><b>Vista previa:</b> en el editor de cargas y en la ficha del circuito, mientras haya cambios pendientes el resultado se calcula con ellos y se muestra marcado como «Vista previa», sin cambiar el proyecto hasta aplicar. Es el mismo cálculo del proyecto.</li>
<li>En el <b>cuadro de conductores</b>, al elegir otra sección las columnas (ΔV, uso del límite y estado, también de los circuitos aguas abajo) muestran la vista previa.</li>
<li>Las ventanas de datos (Datos del proyecto y Parámetros de diseño) se arman con los datos del proyecto: mismas opciones, ayudas y normas. Sus casillas tienen el ancho de su contenido; en Parámetros de diseño la casilla va a la derecha, con los números más angostos.</li>
<li>Al agregar un elemento desde la cinta (una carga, una carga común, videovigilancia, un piso o un tipo de departamento), se abre su ventana para completarlo.</li></ul>`;
B+=sub("Datos del proyecto y parámetros de diseño");
B+=`<ul><li><b>Proyecto › Datos del proyecto</b>: pestañas Proyecto (tipo de edificación —vivienda, edificio u otros usos—, uso, nombre, propietario, ubicación, proyectista y N.° CIP), Suministro (sistema eléctrico y, en el edificio, las longitudes del alimentador general y al tablero de servicios), Vivienda o Edificación (áreas y alimentador), Salidas (alumbrado, tomacorrientes y cocina) y Pisos, o Departamentos en el edificio. En la vivienda, la pestaña Salidas tiene botones para agregar luminarias y tomacorrientes de otra potencia, y cada piso o salida agregada tiene su ✕ para quitarla. En el edificio, la pestaña Departamentos es un editor: a la izquierda la lista de tipos (agregar, duplicar con sus salidas y cargas, quitar) y a la derecha, del tipo elegido, su resultado (MD por unidad, alimentador, ΔV y estado, con vista previa), sus datos, sus salidas de otra potencia y sus cargas especiales, con botones rápidos. Los datos van en una grilla: textos y listas a todo lo ancho, números de a dos o tres por fila. Debajo, una franja con la máxima demanda, el alimentador, la ΔV máxima y el estado, con vista previa mientras se escribe (el cambio de tipo de edificación se calcula al aplicar).</li>
<li><b>Parámetros › Parámetros de diseño</b>: todos los criterios del proyecto en las pestañas Cargas y circuitos, Conductores, Protección y ΔV, Tierra y metrado, y Alturas, con su norma junto a cada grupo; el ícono <b>i</b> muestra la nota de ayuda del grupo.</li></ul>`;
B+=sub("Cálculo automático y resaltar pendientes");
B+=`<ul><li><b>Cálculo automático</b> (activado por defecto): los resultados se actualizan con cada cambio. Al desactivarlo la aplicación advierte que los resultados podrán no corresponder a los datos; se recalcula con <b>Calcular ahora</b> o la tecla <span class="k">F9</span>. Al exportar el Excel, el PDF o el unifilar siempre se recalcula.</li>
<li><b>Resaltar pendientes</b>: marca en ámbar los datos obligatorios que faltan. Al desactivarlo también se muestra una advertencia.</li><li><b>Resultado preliminar (cálculo por partes):</b> mientras falten datos, lo que ya se puede calcular se muestra y lo que depende de un dato que falta dice <b>«pendiente»</b>; al pasar el mouse se ve qué falta. Sin un dato de la carga quedan pendientes la máxima demanda y los alimentadores; sin una longitud, ese alimentador y la caída de tensión de lo que alimenta; sin los datos de un circuito, ese circuito. La caída de tensión máxima es solo la de lo ya calculado y el balance de fases se verifica al completar las cargas. Con el diseño en el plano, sus tableros ya dan un resultado preliminar. El Excel y el expediente se habilitan al completar todos los datos.</li></ul>`;
B+=sub("Atajos de teclado");
B+=tbl(["Tecla","Acción"],[[`<span class="k">Ctrl</span> + <span class="k">Z</span>`,"Deshacer"],[`<span class="k">Ctrl</span> + <span class="k">Y</span>`,"Rehacer"],[`<span class="k">F9</span>`,"Calcular ahora"],[`<span class="k">Esc</span>`,"Cerrar el diálogo o la ventana abierta sin aplicar"],[`<span class="k">Enter</span>`,"En la ficha del circuito: aplicar el dato escrito"],[`<span class="k">↑</span> <span class="k">↓</span> · <span class="k">←</span> <span class="k">→</span>`,"En la ficha del circuito (fuera de los campos): circuito anterior o siguiente · pestaña anterior o siguiente"]]);
B+=fin;

B+=cap("Vivienda unifamiliar");
B+=sub("Datos de la vivienda");
B+=`<p>En <b>Vivienda</b> se ingresan el área techada, el área de sótano (se computa al 75 %), el <b>área libre no techada</b> con su carga unitaria y la longitud del alimentador desde el medidor hasta el tablero general TG. En <b>Sistema eléctrico</b> se elige monofásico 220 V, trifásico 380/220 V o trifásico 220 V.</p><p>El <b>área libre no techada</b> (patios, jardines, cocheras abiertas) se usa cuando el proyectista prevé iluminarla o poner tomacorrientes en ella. Su carga es el área por la <b>carga unitaria</b>, 5 W/m² por defecto y editable, y se suma al 100 % a la máxima demanda de la vivienda (y a la del 1er piso cuando este tiene tablero propio). Este valor <b>no figura en el CNE-Utilización</b>: es un criterio del proyectista que se usa como referencia, y la memoria lo indica así. Con área libre 0 el cálculo no cambia.</p>`;
B+=sub("Salidas");
B+=`<p>Para alumbrado, tomacorrientes generales y tomacorrientes de cocina o lavandería se indica la <b>cantidad de salidas</b>, la <b>potencia por salida</b> (100 W y 180 W típicos) y la <b>longitud</b> desde el tablero hasta la salida más alejada. La aplicación forma los circuitos con un máximo de 12 salidas cada uno (Regla 070-3000).</p><p>Si hay <b>luminarias de distintas potencias</b>, las salidas de la potencia principal se indican en la fila de alumbrado y las demás desde la cinta, con <b>Cargas › Salidas de otra potencia ▾</b> (cantidad, W por salida y, si la vivienda tiene varios pisos, el piso). Por ejemplo, 25 luminarias de las que 8 son de 36 W: 17 salidas de 100 W en la fila y 8 × 36 W en la lista. Los circuitos de alumbrado se llenan en ese orden con la potencia real de cada salida, siempre con un máximo de 12 salidas por circuito; el ejemplo da tres circuitos de 900 W, 800 W y 288 W. Estas luminarias aumentan la potencia instalada y la corriente de los circuitos, pero no la máxima demanda, que el CNE calcula por área (Regla 050-200).</p><p>En el mismo menú, <b>Tomacorrientes</b> agrega tomacorrientes con una potencia distinta a la general, solo para casos excepcionales (por ejemplo, un punto previsto para un equipo de mayor consumo). El menú lista cada piso de la vivienda (1er piso, 2do piso, etc.) para luminarias y para tomacorrientes; en edificios lista cada tipo de departamento. Las salidas agregadas se editan en Salidas, en Pisos y tableros o en Departamentos.</p><p>Con luminarias LED es normal usar potencias menores de 100 W por salida: se ingresa la potencia real del equipo y la aplicación no lo marca como observación.</p>`;
B+=sub("Cargas especiales");
B+=`<p>Cada carga especial (ducha o terma, cocina eléctrica, aire acondicionado, motor u otra carga) tiene su propio circuito. Se indica la descripción, el tipo, las fases, la potencia y la longitud. Las cargas trifásicas solo se aplican si el suministro es trifásico. En viviendas de varios pisos se elige además el <b>tablero</b> del que se alimenta.</p><p>El botón <b>Videovigilancia (CCTV)</b> de la cinta agrega una carga especial (o una carga común en edificios) con su circuito propio; su potencia es la suma de las cámaras, el grabador (NVR/DVR) y el switch PoE, y la indica el proyectista.</p>`;
B+=sub("Editor de cargas");
B+=`<p><b>Cargas › Editor de cargas</b> (o Proyecto › Editor de cargas) abre una ventana con la lista de cargas a la izquierda y los datos de la carga elegida a la derecha: descripción, tipo, potencia, longitud, fases y fase (o el departamento en el edificio, con pestañas Departamentos y Servicios generales). Los <b>botones rápidos</b> (Terma, Ducha, Cocina, Aire, Horno, Bomba, CCTV…) ponen el nombre y el tipo de una carga típica. La franja inferior muestra el resultado del circuito (ITM, conductor, ΔV y estado) y, mientras se escribe, su vista previa.</p>`;
B+=sub("Fase de cada circuito");
B+=`<p>Con suministro trifásico, la fase de cada circuito monofásico la asigna el <b>balance de fases</b> para repartir las cargas («Automática»). Se puede fijar en R, S o T desde Resultados › Balance de fases, desde la ficha del circuito o desde el editor de cargas: es el mismo dato en los tres lugares. En el edificio, cada departamento se conecta completo a una fase.</p>`;
B+=sub("Equipos adicionales del tablero");
B+=`<p>En la ficha del tablero (pestaña Equipos) se marcan los equipos adicionales. Aparecen en el diagrama unifilar, el metrado y la memoria, pero <b>no cambian el cálculo</b>: su uso es criterio del proyectista.</p>`;
B+=tbl(["Equipo","Para qué sirve"],[
 ["Protector contra sobretensiones (DPS)","Tipo 2, In 20 kA, Up ≤ 1.5 kV. Protege los equipos contra sobretensiones transitorias de origen atmosférico o de maniobra; se conecta entre las barras del tablero y la barra de tierra."],
 ["Protector de sobretensión y subtensión","Relé que desconecta la instalación si la tensión sube o baja fuera de los límites ajustados y la reconecta al normalizarse."],
 ["Medidor de energía","Registra el consumo del tablero; útil en tableros de servicios generales o de áreas que se facturan aparte."],
 ["Contactor con reloj horario","Enciende y apaga circuitos por horario, por ejemplo el alumbrado de áreas comunes o exteriores."]]);
B+=sub("Viviendas de varios pisos");
B+=`<p>En <b>Vivienda › Pisos y tableros</b>, el botón <b>+ Agregar piso</b> añade el 2do, 3er piso, etc. Cada piso tiene su <b>tablero de distribución TD</b> alimentado desde el TG, con su área, la longitud TG → TD, sus salidas y longitudes.</p>
<ul><li><b>Circuitos del 1er piso</b>: pueden salir del propio TG o de un tablero TD-1; en ese caso el TG solo alimenta los tableros de piso y las cargas asignadas a él.</li>
<li>El alimentador general se calcula con la máxima demanda de toda la vivienda; cada alimentador de piso, con la Regla 050-200 aplicada al área de ese piso y a las cargas especiales conectadas a su tablero.</li>
<li>Al quitar un piso, sus cargas especiales pasan al TG.</li></ul>`+fig("pisos","Figura 4. Vivienda de tres pisos: máxima demanda por piso y formulario de pisos.");
B+=fin;

B+=cap("Edificio multifamiliar");
B+=`<p>En el modo multifamiliar el edificio se describe por <b>tipos de departamento</b>. Para cada tipo se indica su <b>uso</b>, la cantidad de unidades, el área, la longitud del alimentador (medidor → tablero del departamento), las salidas de alumbrado y tomacorrientes y la longitud de los circuitos.</p><p>Las <b>cargas especiales de los departamentos</b> se ingresan como en la vivienda unifamiliar, una fila por equipo (descripción, tipo, departamento, potencia y longitud), y cada una tiene su propio circuito: dos duchas son dos circuitos. Se agregan con «+ Agregar carga especial», con <b>Cargas › Agregar carga ▾</b> (cargas típicas por departamento, incluida la videovigilancia) o en el editor de cargas. Son monofásicas, porque cada departamento se calcula con suministro monofásico. Para la máxima demanda se suman por tipo con el criterio de la Regla 050-202(1)(a): cocinas, calentadores y aire acondicionado, y en «otras cargas» solo las de más de 1 500 W (las menores ya están cubiertas por la carga básica). Los proyectos guardados con los cuatro totales anteriores (cocina, calentador, aire y otras) se convierten solos en filas de esta lista, con la longitud de los circuitos del departamento.</p><p>Las salidas de alumbrado de cada departamento usan la potencia por salida de Parámetros. Las <b>luminarias de otra potencia</b> se agregan debajo de la lista de departamentos, indicando el tipo al que pertenecen y la cantidad por departamento.</p>
<p>Los <b>servicios generales</b> (alumbrado de áreas comunes, iluminación de emergencia, electrobombas, ascensores, intercomunicadores, videovigilancia) se agrupan en el tablero TSG; las típicas se agregan con <b>Cargas › Agregar carga común ▾</b>. La aplicación verifica que el edificio tenga iluminación de emergencia en las rutas de evacuación. </p><p>En <b>Datos del proyecto › Suministro</b> se indican el sistema del edificio y las longitudes del alimentador general (del medidor de la concesionaria al tablero general) y al TSG. El esquema es: medidor de la concesionaria → <b>tablero general TG</b>, con su interruptor general y sus barras → <b>banco de medidores</b> centralizado en el primer piso (Norma DGE, 301.C.1) → cada departamento desde su medidor.</p><ul><li><b>Banco de medidores junto al TG</b> (por defecto: el banco toma de las barras del TG, sin tramo entre ellos) o <b>en otro lugar</b>: entonces se calcula el alimentador TG → banco (conductor, interruptor y caída de tensión) con la demanda de los departamentos, y la de los servicios generales si su medidor está en el banco; los departamentos y el TSG suman su caída de tensión y su cortocircuito a los de ese tramo. Criterio del proyectista.</li><li><b>Servicios generales (TSG)</b>: con su propio medidor en el banco (lo usual) o directo desde el TG, sin pasar por el banco. Criterio del proyectista.</li><li><b>Medidor de cada tipo de departamento</b>: monofásico o trifásico (Departamentos › Medidor). Con trifásico, el alimentador del departamento y su lugar en el balance de fases son trifásicos.</li><li><b>Del TG al banco</b> (banco junto al TG): pasan la fase o las fases y el neutro de cada suministro, con la sección de su alimentador y sin tierra (el medidor no la lleva), por tuberías al 40 % de ocupación. Si no entran en una tubería de <b>Ø 50 mm</b>, se reparten en varias; el diámetro máximo es un criterio editable en <b>Suministro › Tubería TG → banco</b> (de 25 a 80 mm). Las tuberías se indican en Alimentadores, en el unifilar y al escribir el cálculo en el plano.</li><li>Los medidores del banco se numeran <b>M-1, M-2…</b>: uno por departamento, en el orden de los tipos, y el de servicios generales si está en el banco. La numeración es la misma en el editor y en las láminas IE-05 e IE-06.</li></ul><p><b>Locales de otro uso en el edificio</b> (por ejemplo, un local comercial o una discoteca en el primer piso, con su propio medidor en el banco): en <b>Departamentos</b>, el dato <b>Uso</b> de cada tipo elige <b>Vivienda (Regla 050-202)</b> o un uso de la Tabla 14 (Regla 050-210). Un local se calcula como los otros usos: carga por área (W/m² × área del contorno exterior) con su factor de demanda, más sus cargas especiales a su potencia nominal. Los factores de la Regla 050-202(3)(a) solo se aplican a las unidades de vivienda; la máxima demanda de los locales se suma en el alimentador general al <b>75 %</b> (Regla 050-202(3)(d), por defecto) o al <b>100 %</b>, sin reducción (criterio del proyectista, en <b>Suministro › Locales de otro uso en el alimentador general</b>).</p><p><b>Con el diseño en el plano</b>: cada tablero de departamento indica su tipo (doble clic en el tablero). Si el número de unidades de un tipo no se escribe, sale de los <b>tableros dibujados</b> de ese tipo; si se escribe, manda lo escrito (también en el banco de medidores). Si un tipo tiene un solo tablero dibujado, el cálculo, el explorador y las láminas usan el <b>nombre que tiene en el plano</b> (por ejemplo, TD-01). Un tablero sin tipo pasa al único tipo si hay uno, y la revisión avisa si hay varios.</p>`;
B+=fin;

B+=cap("Oficinas, locales comerciales y otros usos");
B+=`<p>Además de viviendas y edificios multifamiliares, la aplicación calcula edificaciones de <b>otros tipos de uso</b> según la <b>Regla 050-210 y la Tabla 14</b> del CNE-Utilización: oficinas, locales industriales y comerciales, bodegas y restaurantes, bancos, barberías y salones de belleza, clubes, hospedajes, teatros, auditorios, iglesias, cortes de justicia, garajes y edificios de almacenaje. Se eligen al crear el proyecto con la opción <b>Comercial y otros usos</b> del asistente, o después en <b>Proyecto → Tipo de edificación → Uso de la edificación</b>. En <b>Proyectos → Ver un ejemplo → Oficina</b> hay un ejemplo de 250 m² ya calculado; los pisos, tableros, salidas, cargas especiales y luminarias se ingresan igual que en una vivienda.</p>
<p>Diferencias con la vivienda:</p>
<ul><li><b>Máxima demanda</b>: carga por área (W/m² de la Tabla 14 × área) afectada por el factor de demanda de la tabla, más las <b>cargas especiales</b> (aire acondicionado, equipos, vitrinas, cómputo) a su potencia nominal (Regla 050-210(b)). En oficinas el factor cambia a partir de los 930 m².</li>
<li><b>Área</b>: se mide con las <b>dimensiones exteriores</b> y el sótano se cuenta al 100 % como área servida (en vivienda se usan dimensiones interiores y el sótano al 75 %, Regla 050-110).</li>
<li><b>Sin corriente mínima de 40 A</b>: la Regla 050-200(1)(b) es propia de viviendas.</li>
<li><b>Corriente de diseño de los alimentadores 1.25 × I</b>: a diferencia de la vivienda, el CNE no declara no continua la carga de estos usos, por lo que rige la Regla 050-104(3) (carga continua). El parámetro «Reserva en alimentadores de vivienda» no se aplica.</li>
<li><b>Tomacorrientes: ${VA_TOMA_COM} VA por salida</b> al elegir un uso comercial. El CNE-Utilización no fija una potencia por tomacorriente para estos locales (para circuitos derivados manda la carga conectada, Regla 050-102(3)); los ${VA_TOMA_COM} VA son un <b>criterio de ingeniería</b> de uso frecuente en Perú, que deja margen para impresoras, fotocopiadoras y varias computadoras en un mismo punto dúplex. El valor es editable. La aplicación lo ingresa como potencia en W y calcula la corriente con el factor de potencia del proyecto, lo que resulta algo más conservador que tratarlo como VA.</li></ul>
<p><b>Escuelas (Regla 050-204), hospitales (050-206) y hoteles, moteles y dormitorios (050-208)</b> tienen reglas propias y se eligen en el mismo selector. En escuelas se indica además el <b>área de aulas</b> y en hospitales el <b>área de alta intensidad</b> (salas de operación), en el 1er piso y en cada piso de la lista. La diferencia principal con la Tabla 14 es que en estas reglas el <b>factor de demanda se aplica a toda la carga</b>, incluidas las cargas especiales (aire acondicionado, equipos, alumbrado especial como salones de baile); solo la calefacción se rige por la Sección 270. Hasta 900 m² se aplica un único factor; en edificaciones mayores la carga se divide entre el área y se aplica un factor a los primeros 900 m² y otro al exceso.</p>`;
B+=fin;

B+=cap("Editor de diseño y cálculo con el diseño");
B+=`<p>Desde la versión 3.0, el proyecto se puede <b>diseñar sobre el plano de arquitectura</b> y <b>calcular con lo dibujado</b>: las áreas, las salidas, las potencias, las longitudes de los circuitos y de los alimentadores y las cargas especiales salen del plano, en lugar de escribirse. El editor se abre en <b>Planos › Editor de diseño</b>; el diseño se guarda con el proyecto, y el plano DXF en el navegador y en la nube de la cuenta. El editor <b>guarda solo</b>: cada cambio pasa al proyecto y se recalcula. <b>Volver al proyecto</b> cierra el editor; <b>Descartar cambios</b> devuelve el diseño a como estaba al abrirlo.</p>`;
B+=sub("Plano de arquitectura y plantas");
B+=`<ul><li><b>Abrir plano DXF</b>: el archivo del arquitecto (AutoCAD, Guardar como › DXF). La unidad se toma de las cotas del dibujo (la cabecera del archivo a veces está equivocada) y se puede verificar con <b>Comprobar escala</b>.</li><li><b>Encuadrar planta</b>: un rectángulo por cada planta del edificio. En el panel <b>Plantas</b> se elige el <b>piso del cálculo</b> de cada una (sótano, 1er piso, 2do piso… o «no se cuenta»): las áreas, los tableros y los montantes de esa planta pertenecen a ese piso.</li><li>La arquitectura no se edita: es la referencia del arquitecto. Los objetos que estorban (muebles, textos) se pueden ocultar de la vista; el archivo DXF no cambia.</li></ul>`;
B+=sub("Dibujar el diseño");
B+=`<ul><li><b>Símbolos</b> de la Norma DGE (Biblioteca), con su altura de montaje (la de Parámetros › Alturas o la propia) y su potencia (la propia o la de Parámetros).</li><li><b>Tablero</b>: con doble clic se eligen su nombre (TG, TD-1, TD-2…, los mismos del cálculo), su <b>sistema</b> (monofásico o trifásico), su número de circuitos, la descripción y el <b>tipo de cada circuito</b> (alumbrado, tomacorrientes, cocina y lavandería, carga especial o reserva; «automático» lo deduce de las salidas conectadas, y los tomacorrientes dentro de un área llamada «cocina» o «lavandería» van al circuito de cocina). En un edificio, cada tablero de departamento indica su <b>tipo de departamento</b>.</li><li><b>Tuberías</b> por el techo, la pared o el piso, desde la salida del tablero: el circuito pasa solo a lo conectado. Una tubería puede <b>llevar también</b> otros circuitos del mismo tablero.</li><li><b>Alimentadores</b>: la tubería que llega a un medidor (monofásico, trifásico o banco de medidores) o la que sale del tablero con la opción <b>Alimentador</b>; entre pisos, por los <b>montantes</b> (subida en un piso y bajada en el otro).</li><li><b>Pozo de puesta a tierra</b> unido al TG con una tubería: da la longitud del conductor de tierra.</li><li><b>Propiedades</b> (panel derecho): ordenadas por secciones —<b>Datos eléctricos</b>, <b>Rótulos en el plano</b>, <b>Montaje</b> y <b>Dibujo</b>— en todos los elementos (símbolos, tuberías, áreas, textos, cotas, cuadros, leyendas y varios elegidos a la vez), con las acciones al pie.</li></ul>`;
B+=sub("Tableros, banco de medidores y alimentadores");
B+=`<ul><li><b>Tipo de tablero</b> (doble clic en el tablero): <b>Distribución</b>, con sus circuitos C-1, C-2…, o <b>General (alimentadores)</b>, sin circuitos derivados: de él solo salen alimentadores (al banco de medidores, al TSG o a otros tableros), que llegan a su borde. El TG de un edificio sin circuitos propios es general por defecto y se dibuja con el símbolo DGE 09-91-16 (panel de distribución); los tableros trifásicos llevan la marca <b>3φ</b>. La ventana muestra un <b>esquema ilustrativo</b> del tablero: llegada, interruptor general, barras según el sistema y salidas, cada circuito con su fase (R, S, T en turno) y el neutro.</li><li><b>Banco de medidores:</b> al elegirlo o con doble clic, sus propiedades dibujan sus medidores (M-1, M-2…) con el tablero al que va cada uno y si es monofásico (1φ) o trifásico (3φ); en el plano conserva su símbolo, y la lista junto a él solo se escribe con <b>Lista en el plano: Sí</b>. En un edificio, los medidores salen de los departamentos (automático) o se escriben en el banco; fuera de un edificio se escriben ahí: cuántos son, a qué tablero va cada uno y sus fases.</li><li><b>Alimentador desde un tablero:</b> con la herramienta Tubería, al hacer clic en el tablero el menú ofrece <b>«Alimentador → Banco de medidores»</b>, a cada medidor y a cada otro tablero (la tubería se dibuja sola, conectada a los dos; luego se ajustan sus vértices) o <b>«Alimentador punto por punto…»</b>. En un tablero general, el clic derecho ofrece <b>Alimentador ▸</b>.</li><li>El <b>alimentador general</b> se mide desde el medidor de la concesionaria hasta el TG; el tramo TG → banco, aparte, y cada departamento desde el banco.</li></ul>`+fig("diseno-banco","Figura 14. Banco de medidores de un edificio: sus medidores M-1, M-2… en las propiedades y el alimentador del TG al banco.");
B+=sub("Montantes, cajas de paso y plantas");
B+=`<ul><li><b>Punto base de cada planta:</b> cada planta encuadrada tiene un punto base (por ejemplo, el cruce de dos ejes) que la relaciona con las demás: los montantes quedan en el mismo lugar en todos los pisos y lo copiado a otra planta llega a la misma posición. Al actualizar la arquitectura, el punto base se mueve con su planta.</li><li><b>Montante a varios pisos:</b> la subida o bajada enlaza los pisos que atraviesa; en el piso por el que solo pasa se elige su símbolo (canalización o caja de paso) y no se marca «sin conectar». Cada piso suma la altura de entrepiso al recorrido.</li><li><b>Cajas de paso</b> (cuadrada o la del símbolo general): se numeran solas (CP-1, CP-2…) con su rótulo. En sus propiedades se eligen su <b>uso</b> (alimentador o circuito, con su circuito como las salidas), su tipo y su número. Una caja de alimentadores dice qué alimentadores pasan por ella y qué le falta (llegar del banco, del montante o la tubería al tablero). En el tramo que comparten varios alimentadores se escriben los conductores de todos, cada uno con su conductor de protección. Las cajas y canalizaciones que no tienen símbolo en la Norma DGE se rotulan «Sin símbolo en la Norma DGE · criterio».</li><li><b>Circuitos por piso:</b> la lista de circuitos y <b>Asignar circuito ▸</b> muestran solo los tableros del mismo piso.</li></ul>`;
B+=sub("Circuitos, conductores y etiquetas");
B+=`<ul><li><b>Circuito</b> de una salida o una tubería: en Propiedades se elige de una lista con las salidas de cada tablero, agrupadas por tablero. Con varios elementos elegidos, <b>clic derecho › Asignar circuito ▸</b> se lo asigna a todos. Un circuito escrito a mano, sin tablero, toma el tablero de lo conectado.</li><li><b>Conductores automáticos:</b> cada tubería marca sus conductores según el sistema del proyecto (220 V: dos fases y tierra; 380/220 V: fase, neutro y tierra; trifásico: tres fases y tierra) y se <b>cuentan por el recorrido</b> del circuito desde el tablero (criterio del proyectista): la <b>fase</b> llega a cada interruptor y a las salidas que no se encienden con uno; cada <b>tecla</b> del interruptor (su letra) devuelve un <b>retorno (R)</b> por el camino hasta sus luminarias; el neutro (o la segunda fase en 220 V) y la tierra llegan a cada luminaria, y entre dos interruptores de tres vías van sus dos viajeros. Así una tubería puede llevar, por ejemplo, 1F+2R+1N+T. Se actualizan si cambia el circuito o el encendido. Los elegidos a mano (en Propiedades: F, R, N y T) se respetan; <b>Conductores automáticos</b> los vuelve a contar.</li><li><b>Marcas de los conductores:</b> las de la norma (una raya por fase, el neutro con punto y la tierra con tope) y, para los retornos, una raya con una «r» (criterio), del lado opuesto a la longitud.</li><li><b>Interruptor doble:</b> en el encendido se escribe una letra por tecla separada por coma (por ejemplo «a,b»); cada luminaria lleva la letra de su tecla y la revisión verifica que cada letra tenga sus luminarias.</li><li><b>Juntar tuberías:</b> si dos tuberías van entre los mismos puntos (por ejemplo, dos circuitos del tablero a la misma salida), la revisión del diseño lo avisa y ofrece <b>juntarlas</b> en una sola que lleva los dos circuitos, con sus conductores automáticos.</li><li><b>Tubería a interruptor en color</b> (cinta Dibujo › Tuberías, criterio del proyectista): las tuberías que llegan a un interruptor (fase y retornos) se dibujan en naranja para distinguirlas, también en las láminas, y van en la leyenda con (*). La opción se guarda con el proyecto.</li><li><b>Editar líneas y tuberías:</b> clic derecho en un vértice para quitarlo o partir allí; en un tramo, para agregar un vértice, partir, volverlo recto o en arco, invertir la curva o quitarlo. Con dos elegidas, <b>Unir</b> las junta en una sola. Una tubería partida conserva su circuito y la conexión de cada extremo; las tuberías llegan justo al dibujo de cada artefacto.</li><li><b>Etiquetas:</b> en la cinta (Diseño › Tuberías) se eligen para todo el plano la longitud de las tuberías (total, por tramo o ninguna), su circuito y diámetro, y el circuito junto a las salidas. Cada tubería o salida puede tener las suyas: <b>Propiedades › Longitud, Circuito y Ø, Circuito</b> («Como el plano», mostrar u ocultar), o con varias elegidas, <b>clic derecho › Mostrar sus etiquetas</b>, <b>Ocultar sus etiquetas</b> o <b>Etiquetas como en todo el plano</b>. Sirve para despejar las zonas con muchas tuberías; las láminas salen igual que en pantalla.</li></ul>`;
B+=sub("Tipos de luminaria y cargas especiales");
B+=`<p>En <b>Tipos de luminaria</b> se arma el catálogo del proyecto (L1, L2…): descripción, potencia, control (sensor de presencia, fotocelda, temporizador, atenuador) y uso (normal, emergencia o señalización). La <b>biblioteca</b> trae las luminarias de uso común con su <b>potencia típica de mercado</b> (criterio): se reemplaza por la de la ficha técnica del fabricante. Cada luminaria toma la potencia de su tipo si no tiene una propia, y los tipos usados aparecen en la leyenda.</p><p>Las <b>cargas especiales</b> (terma, cocina, aire acondicionado, salida de fuerza, ventilador) llevan su potencia, su tipo para la máxima demanda (calentador, cocina, aire acondicionado, motor u otra carga, como en la Regla 050-200), sus fases y si tienen electrónica.</p>`;
B+=sub("Áreas para el cálculo");
B+=`<p>Las áreas se marcan en el plano de cuatro formas: <b>clic dentro de un ambiente</b> (el contorno se detecta solo), <b>clic dentro del edificio</b> para su contorno exterior, <b>por puntos</b> o con un <b>rectángulo</b>. Cada área lleva el nombre del ambiente y su tipo: techada, contorno exterior, sótano, libre no techada, aulas o alta intensidad, o «no se cuenta».</p><ul><li><b>Vivienda y departamentos</b>: se suman las áreas techadas medidas por las <b>dimensiones interiores</b> (Regla 050-110), y el sótano al 75 %. En un edificio, cada área indica su tipo de departamento: se marcan las de un solo departamento de cada tipo. La ventana <b>Datos para el cálculo</b> avisa si un área está dentro de otra del mismo tipo (se sumarían las dos: un ambiente dentro del contorno del departamento se marca «no se cuenta»), si un área no es de ningún tipo o si su tipo de área no es el de su uso.</li><li><b>Otros usos</b>: el área es la del <b>contorno exterior</b> de cada piso (Regla 050-210); si falta, la aplicación avisa y usa las interiores.</li><li>La detección usa solo las <b>capas de muros</b> (muros, columnas, divisiones, puertas y ventanas), reconocidas por su nombre o elegidas en <b>Áreas › Capas de muros</b>; se cierran los vanos de hasta 1.00 m (criterio que se puede cambiar cuando la aplicación lo pide). Las áreas no se imprimen en las láminas.</li><li><b>Ambientes:</b> cada área lleva su tipo de ambiente (sala, dormitorio, cocina, baño, lavandería, escalera…), tomado del nombre escrito en el plano o elegido en sus propiedades, con la iluminancia mínima de la EM.010. <b>Detectar ambientes</b> marca de una vez un área por cada nombre escrito en las plantas; los que no se pueden cerrar se listan para marcarlos a mano. Las puertas se cierran sobre el muro. El tipo de ambiente decide, por ejemplo, el circuito de cocina y las revisiones de seguridad.</li><li><b>Ambientes y niveles de iluminación</b> (botón <b>Niveles de iluminación</b> en la cinta del editor, en Parámetros o desde un área): una sola ventana con dos pestañas. <b>Ambientes del diseño</b> lista las áreas marcadas con su tipo; <b>Niveles de iluminación</b> trae los ambientes de todos los usos del Anexo de la EM.010 (vivienda, educación, salud, comercio, oficinas, servicios comunales, recreación, transporte y estacionamientos) con su iluminancia mínima (Em), UGR, Uo y Ra. Para elegir el tipo de un ambiente se busca en esa lista y se pulsa <b>Elegir</b> (o doble clic). Por defecto se usa la norma; un valor distinto es <b>criterio del proyectista</b>, y uno menor que el mínimo queda marcado <b>«bajo norma»</b> con un aviso en la revisión. Se pueden agregar <b>ambientes propios</b> (por ejemplo, una pista de baile). Los niveles se guardan en el proyecto y se recuerdan para los proyectos nuevos.</li><li>Un área con tipo de departamento marcada fuera de un edificio cuenta en el área de su piso.</li></ul>`;
B+=sub("Avance y revisión del diseño");
B+=`<ul><li><b>Pestaña Revisión</b> de la cinta del editor: el avance del diseño en siete pasos (plano y escala, ambientes, tableros, artefactos, tuberías, revisión y resultados), cada uno con su estado y un clic que lleva a su herramienta; <b>Revisar diseño</b> con los contadores de seguridad, avisos y notas, y el cálculo (máxima demanda, caída de tensión máxima y estado, con <b>Ver resultados</b>). La pestaña muestra el número de observaciones, y la barra de estado, «Diseño n/7 · avisos».</li><li><b>Panel Proyecto</b> (izquierda): las secciones Cálculo, Diseño eléctrico y Plantas, que se muestran u ocultan con un clic en su título. <b>Cálculo</b> se actualiza mientras se dibuja: máxima demanda, alimentador, ΔV máxima y estado, o lo que falta y cómo sacarlo del plano.</li><li><b>Revisión de seguridad por ambiente</b> (CNE-Utilización): tomacorrientes del baño cerca de la ducha o la tina (150-702(14)) y sin diferencial (150-700(13)); interruptores al alcance desde la ducha (170-326(3), alcance 0.6 m como criterio editable); circuito independiente para la lavandería, el aire acondicionado y los electrodomésticos de más de 15 A (150-704 y 150-702(2)); escaleras con alumbrado e interruptores de tres vías arriba y abajo (170-328). Las duchas y tinas se reconocen por el bloque o la capa del plano, o se marcan con clic derecho. Las observaciones de seguridad van en rojo y primero.</li><li>Si un tablero del plano no está en el cálculo (por ejemplo, se llama TD-1 y el proyecto solo tiene TG), la revisión lo avisa con el botón <b>Renombrar a TG</b>.</li></ul>`+fig("diseno-revision","Figura 13. Editor de diseño: pestaña Revisión con el avance del diseño y panel del proyecto.");
B+=sub("Calcular con el diseño");
B+=`<p>El dato <b>Salidas › Diseño en el plano</b> elige si el proyecto se calcula con los datos escritos o <b>con el diseño</b> (también desde el editor, en <b>Datos para el cálculo</b>, y al aplicar un diseño la aplicación lo ofrece). Con el diseño:</p><ul><li>Cada <b>tablero dibujado</b> da sus circuitos con el mismo nombre, sus salidas y la <b>carga conectada</b>; la caída de tensión se calcula con esa carga hasta la <b>salida más alejada</b> (Regla 050-102). Los tableros que no están dibujados se calculan con los datos escritos.</li><li>La <b>longitud</b> de cada circuito es el recorrido más corto por sus tuberías desde el tablero hasta cada salida, con las derivaciones, más los <b>tramos verticales</b>: la tubería por el techo va a la altura del techo y la del piso a 0 m; en cada artefacto se sube o se baja hasta su altura de montaje y en el tablero desde su borde superior; la tubería por la pared va a la altura del artefacto donde empieza; cada montante suma la altura de entrepiso (3.10 m por defecto) por piso. Si una salida no tiene tubería, se estima en línea quebrada desde el tablero y se avisa.</li><li>El <b>factor de agrupamiento</b> de cada circuito es el de la Tabla 5C (ítem 1) para el mayor número de circuitos que van juntos en una de sus tuberías; entre dos columnas de la tabla se usa la del número mayor.</li><li>La sección de cada conductor es la menor que cumple la capacidad de corriente y la caída de tensión.</li><li>En el edificio, el plano da el alimentador general, el del tablero de servicios generales (y sus circuitos, si el TSG está dibujado), y por cada tipo de departamento su alimentador desde el banco de medidores, sus circuitos y su área.</li></ul><p>Los datos que salen del plano se muestran en las ventanas con la marca <b>«del plano»</b> y no se piden como faltantes. La ventana <b>Datos para el cálculo</b> empieza con un resumen (tableros con circuitos, circuitos, salidas conectadas, datos que salen del plano, caída de tensión máxima de circuito y avisos por revisar) y muestra qué toma el cálculo del plano y qué de lo escrito —en el edificio, una fila por tipo con su uso, unidades, área, circuitos y alimentador desde el banco—, los circuitos de cada tablero con su salida más alejada, el agrupamiento y la caída de tensión, los alimentadores (en el edificio, del medidor al TG y del banco a cada tablero de departamento), las áreas (por piso, o por tipo en el edificio, con el criterio de su uso) y los avisos. Cómo se mide cada dato (criterio de la plataforma) se despliega al pie. La memoria y el expediente explican el <b>origen de los datos</b>. Si un tablero del plano tiene un nombre que el cálculo no tiene, la ventana ofrece un botón para <b>llamarlo como el tablero que falta</b> (por ejemplo, TG). La longitud de cada circuito se puede comprobar tramo por tramo en <b>Cuadro de conductores › Verificar longitudes</b>.</p>`+fig("diseno-datos","Figura 11. Datos del diseño para el cálculo.");
B+=sub("Escribir el cálculo en el plano");
B+=`<p>Con el proyecto calculado con el diseño, <b>Escribir en el plano los conductores y diámetros del cálculo</b> pone en cada tubería sus conductores (marcas de la norma: fases, neutros y tierra), sus secciones y el diámetro de la tubería según todos los circuitos que lleva (40 % de ocupación); también en los alimentadores y en el conductor de tierra. En las tuberías de los interruptores se escriben sus retornos (criterio: unipolar 2, doble o de tres vías 3, de cuatro vías 4 conductores, sin conductor de protección), que se pueden corregir en cada tubería.</p>`;
B+=sub("Láminas del diseño");
B+=`<p>La pestaña <b>Láminas</b> de la cinta del editor reúne lo que se entrega: <b>Láminas</b>, <b>Una por planta</b> e <b>Imprimir todas</b>; <b>Expediente técnico</b>; las ventanas de cálculo y cantidades; y el DXF para AutoCAD.</p><ul><li><b>Ventana Lámina:</b> las láminas del proyecto (IE-01, IE-02…), cada una con lo que muestra (una planta, una zona marcada en el plano o lo que se ve en la pantalla), sus capas, la arquitectura en gris, negro o con sus colores, el diseño a color o en blanco y negro, el título, el número y las notas.</li><li><b>Papel y escala automáticos</b> (recomendado; criterio de la plataforma): las plantas se presentan a <b>1:50</b> en el papel más chico donde entran con su columna (A3, A2 o A1); si no entran en A1, se usa la escala siguiente (1:75, 1:100…). El papel o la escala se pueden elegir a mano; si la zona no entra, el aviso ofrece <b>Usar papel y escala automáticos</b>.</li><li><b>Símbolos del mismo tamaño en el papel:</b> los símbolos, textos, rótulos de los circuitos, la leyenda y el cuadro miden lo mismo impresos a cualquier escala, como los objetos anotativos de AutoCAD; solo la arquitectura cambia con la escala. A escalas menores que 1:75 los símbolos quedan juntos y la ventana lo avisa.</li><li><b>Disposición:</b> marco con 25 mm a la izquierda para anillar y 10 mm en los demás lados; a la derecha, una columna con la <b>leyenda</b> (solo los símbolos usados), el <b>cuadro de circuitos</b> de los tableros de esa planta (si no cabe, sigue en otra columna, por tablero), las <b>notas</b> y el <b>rótulo</b> al pie. El dibujo ocupa el resto, y debajo van el nombre de la planta, su escala y la escala gráfica. En A3 y A4, la leyenda, el cuadro y el rótulo se achican en proporción.</li><li><b>Rótulo:</b> logo, proyecto, propietario, ubicación, plano, especialidad, proyectista y su registro CIP, casilla para la firma y el sello, escala, fecha y número de lámina («1 de 3» si hay varias). Su tamaño va con el papel: en A1, unos 195 × 94 mm.</li><li><b>Una lámina por planta:</b> crea las láminas que faltan para que cada planta con diseño tenga la suya, con papel y escala automáticos y las demás opciones de la primera lámina; una lámina de «todo el diseño» pasa a la primera planta. Una lámina debe mostrar una planta: varias juntas a 1:50 no entran en ningún papel.</li><li><b>Imprimir:</b> <b>Imprimir o guardar PDF</b> (la lámina elegida) o <b>Imprimir todas</b>; en la ventana del navegador se elige <b>Guardar como PDF</b>. Cada lámina sale en una página de su papel.</li></ul>`;
B+=sub("DXF del diseño para AutoCAD");
B+=`<p><b>Diseño a DXF</b> descarga el diseño eléctrico en las <b>mismas coordenadas del plano del arquitecto</b>, con sus capas (en AutoCAD se inserta en 0,0 sobre la arquitectura), y <b>Con la arquitectura</b> entrega <b>el archivo DXF del arquitecto tal cual</b> —sus capas, bloques, sombreados, cotas, textos y presentaciones, con sus capas encendidas o apagadas como él las dejó— con el diseño eléctrico agregado en sus propias capas, en la versión del archivo (desde AutoCAD 2000, con los identificadores que AutoCAD exige). La arquitectura no se vuelve a dibujar ni se convierte en polilíneas. Si el archivo original no se puede usar (por ejemplo, un DXF binario), la arquitectura se dibuja de nuevo con lo visible en el editor.</p><p>El DXF del diseño solo es R12, que abre cualquier versión de AutoCAD: los nombres de capa se adaptan a sus reglas (letras sin tilde, números, $, - y _, hasta 31 caracteres; por ejemplo, «Mi capa 1» pasa a MI_CAPA_1), los textos conservan sus tildes y el archivo se abre centrado en el dibujo.</p>`;
B+=sub("Actualizar arquitectura");
B+=`<p>Cuando el arquitecto entrega una versión nueva, <b>Inicio › Actualizar arquitectura</b> la abre sin perder el diseño: compara la versión nueva con la anterior línea por línea (lo quitado en rojo y lo agregado en verde), mueve el diseño con el dibujo si el arquitecto lo desplazó, vuelve a medir las áreas marcadas con un clic y lista los artefactos junto a un muro que cambió y las tuberías que cruzan un muro nuevo. Se guarda el historial de versiones de la arquitectura del proyecto.</p>`+fig("diseno-cambios","Figura 12. Actualizar arquitectura: el muro que se movió y el área vuelta a medir.");
B+=fin;
B+=cap("Parámetros de diseño");
B+=tbl(["Parámetro","Descripción","Valor por defecto"],[
 ["Factor de potencia","Factor de potencia de las cargas.","0.90"],
 ["Salidas máx. por circuito","Regla 070-3000.","12"],
 ["W por salida y por tomacorriente","Potencias usadas en el modo multifamiliar.","100 W · 180 W"],

 ["Poder de corte mínimo","El poder de corte de cada tablero es el mayor entre el que exige su Icc y el mínimo elegido: 4.5 kA (mínimo comercial usual de los interruptores para uso doméstico, IEC 60898-1), 6 kA, 10 kA o solo según la Icc calculada.","4.5 kA"],
 ["Tipo de interruptor diferencial","Tipo A en todos los circuitos, o tipo AC con tipo A solo donde el diferencial protege una carga marcada «con electrónica» (inverter, variador, inducción, cargador), porque sus fugas con componente continua pueden no ser detectadas por un tipo AC (IEC 60364-5-53, IEC 62423). Cada carga especial tiene el dato «Electrónica» en el editor de cargas y en su ficha.","Tipo A"],
 ["Corriente de arranque de motores","Veces la corriente nominal en arranque directo (usualmente 5 a 8). Se usa para verificar el disparo magnético del ITM y estimar la caída de tensión en el arranque.","6"],

B+=`<p>Las opciones que ofrece cada lista no son arbitrarias: vienen de una regla del código o de un límite de cálculo. Esta sección explica las que pueden llamar la atención de un revisor.</p>`;
B+=tbl(["Parámetro","Opciones","Justificación"],[
 ["ΔV del alimentador general (edificio)","1.0 %, 1.5 % o 2.0 %","La Regla 050-102(1) permite 2.5 % en el conjunto de alimentadores, desde la acometida hasta el tablero de cada departamento. En un edificio ese recorrido tiene dos tramos en cascada: el alimentador general (acometida → TG) y el del departamento (medidor → TD). El valor elegido es la parte del 2.5 % que usa el general; el resto queda para el del departamento (1.5 %, 1.0 % o 0.5 %). Por eso no se ofrece 2.5 %: no dejaría caída disponible para el alimentador del departamento."],
 ["Uso de la edificación","Vivienda (Regla 050-200), un uso de la Tabla 14, o escuela, hospital u hotel","En vivienda la máxima demanda sigue la Regla 050-200 (carga básica por área más cargas especiales con sus factores). En los usos de la Tabla 14, la Regla 050-210 (W/m² por actividad y factor de demanda). Escuelas, hospitales y hoteles tienen reglas propias (050-204, 050-206 y 050-208) y piden el área de aulas o de alta intensidad. Ver el capítulo «Oficinas, locales comerciales y otros usos»."],
 ["Potencia por tomacorriente","180 W en vivienda; 250 VA en oficinas y comercios","180 VA por salida es el valor del CNE tomo V para vivienda. En oficinas y comercios se adopta 250 VA como criterio de ingeniería por la conexión de varios equipos por punto; el CNE-Utilización no fija este valor (Regla 050-102(3): carga conectada). Ambos son editables."],
 ["Carga unitaria del área libre","5 W/m² por defecto, editable","El CNE-Utilización no fija una carga para áreas libres no techadas. 5 W/m² es un valor de referencia usual para iluminación exterior y algunos tomacorrientes; el proyectista lo ajusta según su criterio y se suma al 100 % (sin factor de demanda) a la máxima demanda. Con área libre 0 no interviene en el cálculo."],
 ["Reserva en alimentadores de vivienda","25 % o 0 %","Las Reglas 050-200(3) y 050-202(2) establecen que la carga calculada de la vivienda no es continua, por lo que la norma admite Id = I (0 %). La reserva del 25 % (Id = 1.25 × I) es la práctica usual de diseño para ampliaciones futuras y es el valor por defecto."],
 ["Método de instalación","A1, B1, B2 o C","Son las columnas de la Tabla 2. La Tabla 4 del CNE indica qué método corresponde a cada forma de instalación: tubo empotrado en ladrillo o concreto (mampostería) → B1 (ítem 59); tubo en pared térmicamente aislante → A1; cable multipolar en tubo → B2; cable sin tubo sobre la pared → C."],
 ["Temperatura ambiente","20 °C a 45 °C","Valores de la Tabla 5A para PVC y XLPE. Por debajo de 30 °C la capacidad de los conductores aumenta; debe usarse la temperatura del lugar más caluroso del recorrido."],
 ["Circuitos por tubería","1 a 6","Columnas del ítem 1 de la Tabla 5C (agrupados en el aire, empotrados o encerrados). Se aplica a los circuitos derivados."],
 ["Sección mínima","Derivados 1.5 / 2.5 / 4 mm²; alimentadores 2.5 / 4 / 6 / 10 mm²","Por defecto 2.5 mm² en circuitos y 4 mm² en alimentadores, valores usuales de la práctica de diseño; para las viviendas de la Regla 050-110(2), la Regla 050-106(9) fija 4 mm² en acometidas y 2.5 mm² en alimentadores."],
 ["Salidas máximas por circuito","1 a 12","La Regla 070-3000 limita a 12 las salidas por circuito derivado."],
 ["Diferenciales","Por grupos de tres o por circuito","Regla 150-400: un diferencial de 30 mA a la cabeza de cada grupo de hasta tres circuitos (subregla 8) o uno por circuito (subregla 9)."],
 ["Resistividad del cobre","A temperatura de operación o a 20 °C","La caída de tensión se calcula por defecto con la resistividad a la temperatura máxima del aislamiento (70 °C en PVC, 90 °C en XLPE), lo que es más conservador que usar 0.0175 Ω·mm²/m a 20 °C."]]);

B+=sub("Diagrama de alturas de montaje");
B+=`<p>Se abre en <b>Planos › Ver alturas</b> o en Resultados › Vistas. Dibuja una elevación típica de muro con <b>las salidas que tiene el proyecto</b> según sus circuitos (medidor y tablero siempre; interruptor, braquete y centro de luz si hay alumbrado; tomacorrientes, terma, cocina, aire acondicionado, fuerza, luz de emergencia e interfono si existen), agrupadas por zonas y cada una sobre la línea de su nivel, con su marca a la derecha (por ejemplo ▽ +1.20).</p>
<ul><li>En la elevación se dibujan los <b>aparatos como se ven instalados</b>; en la <b>leyenda</b> de la derecha, su símbolo de la <b>Norma DGE</b> «Símbolos gráficos en electricidad» (R.M. N.° 091-2002-EM/VME, sección 093) con su código y su altura.</li>
<li>La columna <b>A.120</b> compara los interruptores, el interfono y los tomacorrientes con los límites de la Norma A.120 del RNE: «Cumple»; «No cumple» donde la norma rige (edificaciones con atención al público y áreas comunes de edificios con ascensor), o «Fuera de rango» en vivienda unifamiliar, donde no es obligatoria. Las alturas sin límite en la norma se marcan «—».</li>
<li>Las alturas se cambian en <b>Parámetros › Parámetros de diseño › Alturas</b> y se guardan con el proyecto: así se adaptan a cada concesionaria y a cada arquitectura.</li></ul>`+fig("alturas","Figura 6. Diagrama de alturas de montaje de la vivienda de ejemplo.");
B+=sub("Diagrama unifilar");
B+=`<p>Se abre en <b>Planos › Ver unifilar</b>. Dibuja la acometida, el medidor o el banco de medidores, el alimentador general y cada tablero con sus interruptores, diferenciales y circuitos, con los símbolos de la <b>Norma DGE</b> «Símbolos gráficos en electricidad» (R.M. N.° 091-2002-EM/VME); la leyenda indica el código de cada símbolo.</p>
<ul><li>Los <b>equipos del tablero</b> elegidos en su ficha (DPS, relé de tensión, medidor y contactor con reloj) aparecen en la franja «Equipos del tablero» y en la leyenda, con su código DGE.</li>
<li>Con suministro trifásico, cada diferencial agrupa hasta tres circuitos <b>de una misma fase</b>, ya balanceados, para que el diferencial bipolar quede en una sola fase (Regla 150-400(8)); los circuitos trifásicos se agrupan aparte.</li>
<li><b>Planos › Unifilar vertical</b> dibuja la barra de cada tablero en vertical, con un circuito por fila. Por defecto, horizontal.</li>
<li><b>Planos › Lámina</b> (A4 a A1, por defecto A3) es el tamaño en que se imprimirá. Si el texto más pequeño quedara menor de <b>1.8 mm</b> impreso (la menor altura de la ISO 3098 de rotulado técnico, adoptada como criterio), el unifilar se divide en varias láminas: <b>IE-01</b> lleva la acometida, el alimentador general y el cuadro de cargas (en la vivienda, también el tablero general), y los demás tableros pasan a <b>IE-01A, IE-01B…</b>, cada una con «Continúa en la lámina…» y su número en el rótulo. Si aun así no alcanza, la aplicación avisa que conviene una lámina mayor. Es la misma lámina de la descarga DXF.</li></ul>`;
B+=sub("Leyenda y detalles (lámina IE-03)");
B+=`<p>Se abre en <b>Planos › Leyenda y detalles</b>. Reúne:</p>
<ul><li>La <b>leyenda</b> de los símbolos de la Norma DGE que usa el proyecto (tableros y medición, alumbrado, tomacorrientes y fuerza, equipos, canalizaciones, unifilar y los equipos del tablero si los hay), cada uno con su código.</li>
<li>El <b>detalle del pozo de puesta a tierra</b> en corte, con la varilla, el conductor y la resistencia del cálculo (Reglas 060-702 y 060-712, Tabla 17), sus elementos numerados y el cuadro de materiales. Las medidas del hoyo y de la tapa y los materiales del tratamiento son criterio de diseño y se editan en <b>Parámetros › Tierra y metrado › Detalle del pozo de tierra</b>; el diámetro y la profundidad del hoyo son opcionales. Sal y carbón se incluyen solo si hay tratamiento del suelo. Los mismos valores pasan al metrado.</li></ul>`+fig("detalles","Figura 7. Leyenda de símbolos DGE y detalle del pozo de puesta a tierra.");
B+=sub("Detalle de tableros (lámina IE-04)");
B+=`<p>Se abre en <b>Planos › Detalle de tableros</b>. Si los tableros no entran a lo ancho de la lámina elegida, siguen en IE-04A, IE-04B…; el detalle de la señal va en la última. Para cada tablero muestra:</p>
<ul><li>La <b>vista de la puerta</b> y la <b>vista interior</b> (sin puerta ni cubierta) del mismo tamaño, porque son el mismo gabinete, centradas a la izquierda de los datos del tablero. Si no caben juntas, la puerta se dibuja a escala menor con la misma proporción.</li>
<li>El <b>gabinete</b>, según la ficha del tablero (pestaña Equipos): por defecto, <b>de PVC empotrable con tapa transparente</b> en los tableros de vivienda y de departamento de hasta 24 polos, y <b>metálico empotrado</b> en el TSG y en los de más polos. Es criterio del proyectista y se cambia en la ficha; con más de 24 polos la opción PVC queda desactivada, porque no hay medida de catálogo de PVC para más polos.
<ul><li><b>Puerta metálica:</b> bisagras, chapa con manija, la señal «¡Peligro! Riesgo eléctrico» (Norma DGE de señalización, código 141-02-02) centrada, la placa con el nombre del tablero y rejillas de ventilación.</li>
<li><b>Puerta de PVC:</b> marco blanco y una tapa de policarbonato ahumado por fila, con los interruptores vistos a través, su lengüeta y una plaquita con el nombre; sin señal, a criterio del proyectista.</li></ul></li>
<li>La <b>medida del gabinete</b> (ancho × alto, referencial) y los <b>polos por fila</b> de riel DIN salen de la capacidad en polos, con medidas de catálogo de fabricantes (no las fija el CNE; criterio). PVC: hasta 12 polos, 280 × 220 mm con una fila de 12; de 13 a 24 polos, 300 × 370 mm con dos filas de 12. Metálico: hasta 12 polos, 250 × 300 mm (10 por fila); de 13 a 24, 300 × 400 mm (12 por fila); de 25 a 30, 350 × 500 mm (15 por fila); de 31 a 54, 500 × 800 mm (18 por fila); más de 54, 600 × 1200 mm (24 por fila). El gabinete se dibuja con al menos esa proporción y la medida va en la cota de la puerta, en los datos del tablero y en el metrado.</li>
<li>En la vista interior, los dispositivos en el orden del cuadro de cargas, cada diferencial con sus circuitos, el riel DIN, las canaletas, las barras de neutro y de tierra, y la capacidad mínima en polos (la misma del metrado). Al lado, los datos del tablero.</li>
<li>Con <b>Planos › Tableros peinados</b>, el cableado completo: los conductores en colores con su marca en cada borne (R rojo, S negro y T azul; F rojo en monofásico; N blanco y PE verde-amarillo), la llegada del alimentador y el cuadro de <b>conexiones</b> (de dónde viene y a dónde va cada salida). Los colores siguen la práctica usual; el orden de las fases es criterio de diseño.</li>
<li>Las notas incluyen el <b>espacio de trabajo</b>: libre de 1 m frente al tablero, con piso no deslizante, que permita abrir la puerta al menos 90° (Regla 020-308).</li>
<li>El detalle de la señal: triángulo equilátero amarillo con banda negra de 0.10 <i>d</i>, tamaño según la distancia de observación (A ≥ l² / 2000) e iluminación de al menos 50 lux.</li></ul>`+fig("tableros","Figura 8. Detalle de tableros con la opción de tablero peinado.");
B+=sub("Tablero general del edificio (lámina IE-05)");
B+=`<p>Solo en edificios. Se abre en <b>Planos › Tablero general</b>. Es el tablero entre la caja toma de la concesionaria y el banco de medidores, con:</p>
<ul><li>La <b>vista de la puerta</b> y la <b>vista interior</b> del mismo tamaño, en la proporción de su gabinete metálico de adosar de referencia, 600 × 1000 mm (criterio).</li>
<li>El <b>interruptor general</b> del alimentador general en caja moldeada, con su corriente y su poder de corte (los del cálculo, lámina IE-01).</li>
<li>Las <b>barras de cobre</b> N, R, S y T sobre sus aisladores. De cada una sale con pletina y perno la fase que el balance asigna a cada suministro, con su neutro; donde una pletina pasa por delante de otra barra lleva manga aislante.</li>
<li>Los textos de la llegada, del interruptor, de cada salida y del riel DIN, fuera del gabinete con su línea de referencia; la barra de tierra unida a la puerta y al pozo.</li>
<li>Los datos del tablero y el cuadro de conexiones (salida, medidor de destino, bornes e interruptor). Las notas indican que los medidores quedan en el lado de carga del interruptor general (Regla 040-402(2)) y el espacio de trabajo (Regla 020-308).</li></ul>`;
B+=sub("Banco de medidores y balance de fases (lámina IE-06)");
B+=`<p>Solo en edificios. Se abre en <b>Planos › Banco de medidores</b>. Muestra:</p>
<ul><li>La <b>vista exterior</b> de las cajas de la concesionaria a escala: caja toma F1 y cajas de medidor monofásico (LRM) o trifásico (LTR), con su visor y su medidor, en filas de largo D = número de conexiones × ancho de caja. La escala se ajusta para que el banco llene la vista.</li>
<li>Las <b>cotas</b>: la cadena de alturas desde el suelo, el alto total hasta el borde superior, el ancho de cada tipo de caja y las medidas de cada caja. Se verifica que el banco no supere la altura máxima.</li>
<li>Las medidas son las de la concesionaria (Luz del Sur por defecto) y se editan en <b>Parámetros › Banco de medidores</b>; no las fija el CNE.</li>
<li>El <b>balance de cargas por fase</b>: los suministros de cada fase y la demanda por fase con su desbalance.</li>
<li>El <b>cuadro de suministros</b>, con la verificación del calibre de la instalación interna según la tabla de la concesionaria.</li>
<li>Las notas incluyen la reserva de conductor no menor de 450 mm en los puntos de conexión de cada medidor (Regla 040-402(1)(c)).</li></ul>`;
B+=sub("Editar un circuito");
B+=`<p>Un clic en un circuito del explorador muestra su resumen en el panel del proyecto; con doble clic (o con <b>Abrir ficha del circuito</b> en el panel) se abre su ficha, donde se editan sus datos. Las cargas especiales también se editan en el editor de cargas (incluido su tablero); los circuitos de alumbrado y tomacorrientes remiten a las salidas del piso correspondiente.</p>`;
B+=sub("Cuadro de conductores");
B+=`<p>En <b>Resultados › Cuadro de conductores</b> se ve, en una sola tabla, cada alimentador y circuito derivado con su longitud, corriente, interruptor, sección mínima, sección usada, caída de tensión acumulada, uso del límite de caída de tensión y estado. Por defecto cada tramo usa la sección <b>automática</b> (la primera de su lista): la menor que cumple la capacidad de corriente (Tabla 2 con los factores 5A y 5C) y la caída de tensión (Regla 050-102). En la columna «Mín.», la marca <b>ΔV</b> indica que esa sección la define la caída de tensión y no la corriente.</p>
<p>La lista de cada tramo ofrece además las <b>tres secciones siguientes</b>, que también cumplen, con la caída de tensión que darían. El cálculo solo acepta una sección <b>mayor</b> que la automática; si después un cambio de datos hace que la elegida ya no sea mayor, vuelve a la automática. Sin elecciones, los resultados no cambian. Las secciones elegidas se marcan en amarillo («Sección mayor») y generan la recomendación «Secciones mayores que la mínima que cumple», porque un conductor mayor también cumple pero cuesta más. <b>Todo en automático</b> deshace todas las elecciones. El botón <b>?</b> de la barra de título muestra este criterio. Con doble clic en un circuito se abre su ficha.</p>
<p><b>Verificar longitudes:</b> con un clic se elige un circuito del cuadro y el botón <b>Verificar longitudes</b> abre una tabla con los tramos que suma su longitud cuando sale del plano. La pestaña <b>Recorrido</b> lista, desde el tablero hasta la salida más alejada, cada tubería (por el techo, el piso o la pared, desde dónde y hasta dónde, y los circuitos que lleva) y cada tramo vertical (en el tablero desde su borde superior; en cada artefacto hasta su altura de montaje; en una salida de paso, la subida y la bajada; en los montantes, la altura de entrepiso), con el acumulado y el total, que es la longitud del cuadro. La pestaña <b>Salidas</b> da el recorrido de cada salida del circuito (S-1, S-2…, de la más cercana a la más alejada). La lupa de cada fila y <b>Ver el recorrido en el plano</b> lo muestran en el editor. Es una verificación: no cambia ningún resultado.</p>`;
B+=sub("Ficha del circuito");
B+=`<p>Ventana de propiedades de un circuito derivado. Se abre con doble clic en el circuito (explorador o cuadro de conductores), con <b>Abrir ficha del circuito</b> en el panel del proyecto o con <b>Resultados › Ficha del circuito</b> (abre el circuito seleccionado o, si no hay, el primero). Arriba muestra el circuito, con <b>▲▼</b> para pasar al anterior o al siguiente, su descripción, su tablero y la verificación (Conforme o Revisar). Tiene cuatro pestañas:</p>`;
B+=tbl(["Pestaña","Contenido"],[
 ["Carga","Datos editables en dos columnas: en cargas especiales y servicios, descripción, tipo, potencia, longitud, fases y tablero (si hay pisos); en alumbrado y tomacorrientes, número de salidas, potencia por salida y longitud, que afectan a todos los circuitos del grupo; y la fase, con suministro trifásico. En los circuitos de un piso superior o de un tipo de departamento, el número de salidas y la longitud son los de ese piso o departamento (se repiten en todas sus unidades); la potencia por salida es la general. Debajo, una franja con la potencia, el sistema, la fase, el ITM, el conductor, la ΔV y el estado."],
 ["Conductor","Fase y neutro, conductor de protección, designación, tubo, corriente nominal, corriente de diseño (nominal × 1.25), Iz de la Tabla 2 según el método de instalación, factor de corrección (temperatura de la Tabla 5A × agrupamiento de la Tabla 5C) e Iz corregida."],

B+=`<p>Los resultados son los mismos de la memoria y del expediente; la ficha no usa fórmulas propias. Lo que se edita en ella se guarda en los datos del proyecto. Mientras haya cambios sin aplicar, todas las pestañas muestran la <b>vista previa</b> (el recuadro de arriba dice «Vista previa»).</p>`;
B+=sub("Ficha del tablero");
B+=`<p>Se abre con doble clic en un tablero del explorador, con <b>Abrir ficha del tablero</b> en el panel del proyecto o con <b>Resultados › Ficha del tablero</b>. Pestañas: <b>Alimentador</b> (recorrido, sistema, <b>longitud editable</b> con vista previa, potencia, corriente y corriente de diseño, interruptor, Iz corregida, conductor, tubo y caída de tensión del tramo y acumulada), <b>Tablero</b> (cortocircuito en barras, poder de corte mínimo y sus circuitos; la pestaña Protección de cada circuito muestra el tipo de diferencial y, en motores, la verificación del arranque; doble clic abre la ficha de cada uno) y <b>Equipos</b> (equipos adicionales). Con ▲▼ se pasa al tablero anterior o siguiente.</p>`;
B+=sub("Recomendaciones de diseño");
B+=`<p>Además de las verificaciones normativas (que indican si algo <b>no cumple</b>), la aplicación muestra <b>recomendaciones de diseño</b>: decisiones que sí cumplen la norma, pero que pueden llevar a conductores mayores de lo necesario (<i>posible sobredimensionamiento</i>) o dejar poco margen para ampliaciones (<i>criterio ajustado</i>). No detienen el cálculo. Cada una tiene un botón <b>Ir a…</b> que abre directamente el dato que la origina (el campo de parámetros, la longitud del alimentador o el circuito en el explorador). El proyectista la revisa y, si la decisión es intencional, pulsa <b>Entendido, lo acepto</b>; la aceptación queda registrada con su fecha en el proyecto y puede deshacerse. Las recomendaciones aceptadas se listan en el expediente técnico, en «Verificaciones normativas», como criterios revisados y aceptados por el proyectista; las pendientes no se imprimen.</p>`;

 ["Secciones mayores que la mínima que cumple","En el cuadro de conductores se eligió una sección mayor que la automática.","El conductor mayor también cumple, pero cuesta más; si no hay un motivo (ampliación prevista, criterio del cliente), conviene volver a la sección automática."],
